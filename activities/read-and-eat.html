  진행 상황은 이 브라우저(localStorage "read_eat_v1")에만 저장한다.

  글 세 갈래(사용자 결정)
  · 앱에 직접 쓴 짧은 글: 이야기·광고·칼럼. 인물·상품·필자는 모두 가상. 과학 내용은 아래 근거로 확인함
  · 공공 문헌 원문: 학교급식법 시행규칙 제5조제2항·제7조제2항(법제처 국가법령정보, 시행 2021. 6. 30.).
    법령은 저작권법 제7조제1호에 따라 보호받지 않는 저작물이라 원문을 그대로 싣는다
  · 실제 도서: 본문은 싣지 않는다. 교사·학생이 서지 정보와 짧은 발췌(저작권법 제28조 '정당한 범위'의 인용)를 넣는다
  결과물은 글에 따라 달라진다: 이야기 → 인물에게 쓰는 상담 편지, 광고 → 주장 검증 보고서, 칼럼·법령 → 설득하는 글(제안서),

-->

  if (a === "tag") { const k = b.dataset.k; if (s.tags[k] === s.pen) delete s.tags[k]; else s.tags[k] = s.pen; save(); say(s.tags[k] ? PEN[s.pen] + "으로 밑줄" : "밑줄을 지웠어요"); return keep(`[data-act="tag"][data-k="${k}"]`); }
  if (a === "ev") { const id = b.dataset.id, i = s.ev.indexOf(id); if (i >= 0) s.ev.splice(i, 1); else s.ev.push(id); save(); return keep(`[data-act="ev"][data-id="${id}"]`); }
  if (a === "ptype") { s.prodType = b.dataset.v; save(); return keep(`[data-act="ptype"][data-v="${s.prodType}"]`); }
  if (a === "verdict") { s.prod["v" + b.dataset.i] = b.dataset.v; save(); return keep(`[data-act="verdict"][data-i="${b.dataset.i}"][data-v="${b.dataset.v}"]`); }
  if (a === "judge") { s.judged = true; save(); say("참고 판정을 열었어요. 다르면 근거를 다시 생각해 봐요."); return keep(); }
  if (a === "cite") { const e = evById(b.dataset.id), k = lastField || (s.prodType === "letter" ? "plan" : s.prodType === "check" ? "r0" : "r1");
    s.prod[k] = ((s.prod[k] || "").trim() + " " + cite(e)).trim(); save(); say("근거를 넣었어요."); return keep(`#w-${k}`); }
  if (a === "finish") { s.done = true; save(); say("저장했어요."); return keep(); }
  if (a === "down") return download();
  if (a === "copy") { const txt = reportText(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => say("복사했어요."), () => say("복사하지 못했어요. 글을 직접 선택해 복사해 주세요.")); }
});
document.addEventListener("input", e => {
  const el = e.target, t = S.cur && T(S.cur), s = t && st(t.id);
  if (el.id === "inName") { S.name = el.value; return save(); } if (el.id === "inTeam") { S.team = el.value; return save(); }
  if (el.dataset.book) { S.book[el.dataset.book] = el.value; save(); if (el.dataset.book === "excerpt") { const p = el.closest(".su-card").querySelector(".su-tiny"); if (p) p.textContent = `문장 ${sentList(T("book")).length}개를 찾았어요.`; } return; }
  if (!s) return;
  if (el.dataset.k) { s[el.dataset.k] = el.value; save(); if (el.dataset.k === "q") return render(); return refreshNav(t, s); }
  if (el.dataset.w) { s.prod[el.dataset.w] = el.value; save(); return refreshNav(t, s); }
});
function refreshNav(t, s) { /* 입력 중에는 다시 그리지 않고 버튼·점검표만 고친다 */
  const n = s.step, nx = document.querySelector(`[data-act="step"][data-n="${n + 1}"].su-btn`); const msg = n < 5 ? canStep(t, s, n + 1) : "";
  if (nx) nx.disabled = !!msg;
  const ck = document.querySelector(".check"); if (ck && n === 4) ck.innerHTML = prodCheck(t, s).map(c => `<li>${c[1] ? "✅" : "⬜"} ${esc(c[0])}</li>`).join("");
  const fin = document.querySelector('[data-act="finish"]'); if (fin) fin.disabled = s.refl.trim().length < 10;
  const jd = document.querySelector('[data-act="judge"]'); if (jd && t.claims) jd.disabled = !t.claims.every((c, i) => s.prod["v" + i]);
}
render(true);
</script>
