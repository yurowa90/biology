  글 세 갈래(사용자 결정)
  · 앱에 직접 쓴 짧은 글: 이야기·광고·칼럼. 인물·상품·필자는 모두 가상. 과학 내용은 아래 근거로 확인함
  · 공공 문헌 원문: 학교급식법 시행규칙 제5조제2항·제7조제2항(법제처 국가법령정보, 시행 2021. 6. 30.).
    법령은 저작권법 제7조제1호에 따라 보호받지 않는 저작물이라 원문을 그대로 싣는다
  · 실제 도서: 본문은 싣지 않는다. 교사·학생이 서지 정보와 짧은 발췌(저작권법 제28조 '정당한 범위'의 인용)를 넣는다
  결과물은 글에 따라 달라진다: 이야기 → 인물에게 쓰는 상담 편지, 광고 → 주장 검증 보고서, 칼럼·법령 → 설득하는 글(제안서),

-->

    <li>읽기·논증 틀: 교과 문식성(Shanahan & Shanahan, 2008, Harvard Educational Review 78(1), 40–59). 쓰기 틀은 Toulmin(1958, The Uses of Argument)의 모형을 수업용으로 단순화한 것입니다(근거–보장은 '근거'와 '받치는 이유'로, 한정어·보강은 생략). 반론–재반론 구조는 과학 논증 수준틀(Osborne, Erduran & Simon, 2004, Journal of Research in Science Teaching 41(10))에 더 가깝습니다. 과학 논증의 협력적 성격은 Osborne(2010, Science 328, 463–466).</li></ul></div>
  <div class="su-card su-stack su-measure"><h2 class="su-h3">주의</h2><ul class="su-small">
    <li>실제 도서는 본문을 앱에 싣지 않습니다. 발췌는 공표된 저작물을 교육 목적의 정당한 범위에서 공정한 관행에 맞게 인용하고(저작권법 제28조), 출처를 밝히도록(제37조) 지도해 주세요. 수업 목적이면 공표된 저작물의 일부분을 복제할 수 있습니다(제25조제3항). 결과 파일에는 발췌 문장을 넣지 않습니다.</li>
    <li>예시로 든 『잡식동물의 딜레마』(마이클 폴란 지음, 조윤정 옮김, 다른세상)의 출판연도는 확인하지 못했습니다. 판권면에서 확인해 넣어 주세요.</li>
    <li>이야기·광고·칼럼의 인물·상품·필자는 가상입니다. 알레르기 설명은 일반 정보이며 진료를 대신하지 않습니다.</li>
    <li>형식 점검표는 글자 수(인용 제외)·인용·개념어 같은 형식만 봅니다. 내용의 타당성은 교사·동료 피드백으로 판단해 주세요.</li>
    <li>공용 기기에서는 활동 뒤 '이 기기에서 내 기록 지우기'를 안내해 주세요.</li></ul></div>
  <div class="su-row"><button class="su-btn" data-act="home">책장으로</button></div></section>`;
}
function renderProg() {
  const t = S.view === "read" && T(S.cur), s = t && st(t.id);
  $("#prog").innerHTML = t ? STEPS.map((x, i) => `<li class="${i < s.step ? "done" : i === s.step ? "now" : ""}"><i></i><span>${x}</span></li>`).join("")
    : TEXTS.map(x => `<li class="${S.t[x.id] && S.t[x.id].done ? "done" : ""}"><i></i><span>${x.genre}</span></li>`).join("");
}
let lastField = null;
function render(top) {
  const fk = document.activeElement && document.activeElement.id;
  try {
    $("#app").innerHTML = S.view === "read" && T(S.cur) ? readView() : S.view === "teacher" ? teacher() : S.view === "report" ? report() : home();
    renderProg();
  } catch (err) {
    console.warn(err);
    $("#app").innerHTML = `<section class="su-stack"><h1 class="su-h1">기록을 불러오지 못했어요</h1><p>이 기기에 저장된 기록이 손상된 것 같아요. 기록을 지우고 처음부터 시작할 수 있어요.</p><div class="su-row"><button class="su-btn" data-act="wipe">기록 지우고 다시 시작</button></div></section>`; return;
  }
  if (top) { window.scrollTo(0, 0); const h = $("#app h1"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } else $("#app").focus({ preventScroll: true }); }
  else if (fk) { const el = document.getElementById(fk); if (el) { el.focus({ preventScroll: true }); if ((el.type === "text" || el.tagName === "TEXTAREA") && el.value) el.setSelectionRange(el.value.length, el.value.length); } }
}
function keep(sel) { const y = window.scrollY; render(); window.scrollTo(0, y); if (sel) { const el = document.querySelector(sel); if (el) el.focus({ preventScroll: true }); } }
document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.w) lastField = e.target.dataset.w; });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return; const a = b.dataset.act;
  if (a === "wipe") { if (!confirm("이 기기에 저장된 이름·모둠·글·책 정보를 모두 지울까요? 보고서를 먼저 내려받았는지 확인하세요.")) return; try { localStorage.removeItem(LS); } catch (x) {} S = fresh(); say("기록을 지웠어요."); return render(true); }
  const t = S.cur && T(S.cur), s = t && st(t.id);
  if (a === "home") { S.view = "home"; save(); return render(true); }
  if (a === "teacher") { S.view = "teacher"; save(); return render(true); }
  if (a === "report") { S.view = "report"; save(); return render(true); }
  if (a === "open") { S.cur = b.dataset.id; S.view = "read"; st(S.cur); save(); return render(true); }
  if (!s) return;
  if (a === "step") { const n = +b.dataset.n; if (n > s.step && canStep(t, s, n)) return say(canStep(t, s, n)); s.step = n; save(); return render(true); }
  if (a === "pen") { s.pen = b.dataset.v; save(); say(PEN[s.pen] + " 펜을 골랐어요."); return keep(`[data-act="pen"][data-v="${s.pen}"]`); }
  if (a === "tag") { const k = b.dataset.k; if (s.tags[k] === s.pen) delete s.tags[k]; else s.tags[k] = s.pen; s.done = false; save(); say(s.tags[k] ? PEN[s.pen] + "으로 밑줄" : "밑줄을 지웠어요"); return keep(`[data-act="tag"][data-k="${k}"]`); }
  if (a === "ev") { const id = b.dataset.id, i = s.ev.indexOf(id); if (i >= 0) s.ev.splice(i, 1); else s.ev.push(id); save(); return keep(`[data-act="ev"][data-id="${CSS.escape(id)}"]`); }
  if (a === "ptype") { s.prodType = b.dataset.v; lastField = null; save(); return keep(`[data-act="ptype"][data-v="${s.prodType}"]`); }
  if (a === "verdict") { if (s.judged && t.claims) return say("참고 판정을 연 뒤에는 처음 판정이 저장돼요. 바뀐 생각은 아래 칸에 써 주세요.");
    s.prod["v_" + b.dataset.c] = b.dataset.v; s.done = false; save(); return keep(`[data-act="verdict"][data-c="${CSS.escape(b.dataset.c)}"][data-v="${b.dataset.v}"]`); }
  if (a === "judge") { const cl = claimsOf(t); if (!cl.every(c => s.prod["v_" + c.id] && own(s.prod["r_" + c.id]).length >= 10)) return say("판정과 근거를 모두 써야 열 수 있어요.");
    s.locked = Object.fromEntries(cl.flatMap(c => [["v_" + c.id, s.prod["v_" + c.id]], ["r_" + c.id, s.prod["r_" + c.id]]])); s.judged = true; save(); say("처음 답을 저장하고 참고 판정을 열었어요."); return keep("#w-rev"); }
  if (a === "cite") { const e = evById(b.dataset.id); if (!e) return; const flds = fieldsOf(t, s).filter(k => !k.startsWith("v_"));
    const k = lastField && flds.includes(lastField) && document.getElementById("w-" + lastField) ? lastField : flds.find(f => document.getElementById("w-" + f) && /plan|r1|^r_/.test(f)) || flds[0];
    if (!k) return; s.prod[k] = ((s.prod[k] || "").trim() + " " + cite(e)).trim(); s.done = false; save(); say("근거를 넣었어요."); return keep(`#w-${CSS.escape(k)}`); }
  if (a === "finish") { s.done = true; save(); say("저장했어요."); return keep(); }
  if (a === "down") return download();
  if (a === "copy") { const txt = reportText(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => say("복사했어요."), () => say("복사하지 못했어요. 글을 직접 선택해 복사해 주세요.")); }
});
function onEvq(el, s, t) { s.q = el.value; save(); const r = $("#evres"); if (r) r.innerHTML = evResults(t, s); }
document.addEventListener("compositionend", e => { const el = e.target, t = S.cur && T(S.cur), s = t && st(t.id); if (el.id === "evq" && s) onEvq(el, s, t); });
document.addEventListener("input", e => {
  const el = e.target, t = S.cur && T(S.cur), s = t && st(t.id);
  if (el.id === "inName") { S.name = el.value; return save(); } if (el.id === "inTeam") { S.team = el.value; return save(); }
  if (el.dataset.book) { S.book[el.dataset.book] = el.value; save(); if (el.dataset.book === "excerpt") { const p = el.closest(".su-card").querySelector(".su-tiny"); if (p) p.textContent = `문장 ${sentList(T("book")).length}개를 찾았어요.`; if (s) refreshNav(t, s); } return; }
  if (!s) return;
  if (el.id === "evq") { if (e.isComposing) return; return onEvq(el, s, t); } // 한글 조합 중에는 결과 목록만, 조합이 끝난 뒤 갱신
  if (el.dataset.k) { s[el.dataset.k] = el.value; if (el.dataset.k !== "refl") s.done = false; save(); return refreshNav(t, s); }
  if (el.dataset.w) { s.prod[el.dataset.w] = el.value; s.done = false; save(); return refreshNav(t, s); }
});
function refreshNav(t, s) { /* 입력 중에는 다시 그리지 않고 버튼·점검표만 고친다 */
  const n = s.step, nx = $("#btnNext"), msg = n < 5 ? canStep(t, s, n + 1) : "";
  if (nx) nx.disabled = !!msg; const wb = $("#whyBlocked"); if (wb) wb.textContent = msg;
  const ck = document.querySelector(".check"); if (ck && n === 4) ck.innerHTML = checkList(prodCheck(t, s));
  const fin = document.querySelector('[data-act="finish"]'); if (fin) fin.disabled = s.refl.trim().length < 10;
  const jd = document.querySelector('[data-act="judge"]'); if (jd) jd.disabled = !claimsOf(t).every(c => s.prod["v_" + c.id] && own(s.prod["r_" + c.id]).length >= 10);
}
render(true);
</script>
