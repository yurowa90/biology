<!--
  식탁 상담소 · 영양·식생활 탐구 (v1.1) — 프로토타입 v0.1(의뢰인 게임)을 독립 앱으로 재구성
  단일 파일 정적 페이지(공용 디자인 student-ui.css 외 라이브러리 없음). 진행 상황은 이 브라우저(localStorage "nutri_clinic_v1")에만 저장.
  흐름: 홈(의뢰인 고르기) → (처음 한 번) 시작 전 점검 → 1 문제 발견(영양표시) → 2 자료 해석(7일 기록) → 3 해결책 설계(식단 다시 짜기)
    → 4 기술 검증(AI 추천 판정) → 5 논증 → 6 나에게 옮기기(실행 의도·환경 제안·마무리 점검) → 완료(보고서·결과 파일)
  v1.1: 영양교육의 '실행'·'환경' 요소(Contento, 2008)를 보강. 실천 계획은 학생이 고를 때만 결과 파일에 들어간다.
    사전·사후 점검은 평행형 A·B를 무작위 순서로 쓴다(수업용, 타당도 검증 전). 식품군 표시는 판정에 넣지 않는 참고 정보.
  v0.1에서 바꾼 것: 기준값을 2025 한국인 영양소 섭취기준으로 교체(칼슘·식이섬유가 낮아짐), 근거 없는 배점·등급을 없애고 기준 체크리스트로,
    사례의 숫자(문항·7일 그래프의 '어제'·현재 식단 합계)를 서로 일치시킴, 키보드·화면 낭독기·어두운 모드 지원.
  기준값 출처와 확인 상태: school-meal-gg/VERIFICATION.md. 의뢰인·7일 기록은 가상이고, 음식의 영양 값과 가격은 수업용 근삿값이다.
-->

<script>
"use strict";
/* ═══════════════ 기준값 (출처: school-meal-gg/VERIFICATION.md) ═══════════════
   · 15~18세 에너지필요추정량·단백질 권장섭취량·칼슘 권장섭취량·식이섬유 충분섭취량·나트륨 만성질환위험감소섭취량, 첨가당 10%:
     보건복지부·한국영양학회 「2025 한국인 영양소 섭취기준」 요약표
   · 1일 영양성분 기준치: 「식품 등의 표시·광고에 관한 법률 시행규칙」[별표 5](식약처 영양표시 가이드라인 2024.12)
   · 카페인: 식품의약품안전처 어린이·청소년 최대 일일섭취권고량 체중 1 kg당 2.5 mg 이하 */
const DRV = { kcal: null, carb: 324, sug: 100, pro: 55, fat: 54, sfat: 15, na: 2000, ca: 700, fib: 25 }; // 1일 영양성분 기준치
const KDRI = { 남: { eer: 2700, pro: 65, ca: 800, fib: 25 }, 여: { eer: 2000, pro: 55, ca: 700, fib: 20 }, naCDRR: 2300, sugPct: 0.10, cafPerKg: 2.5 };
const BUDGET = 15000, MAXEACH = 3, MAXITEMS = 14;

/* 음식: 수업용 근삿값(1회 제공량, 가격 포함). id, 이모지, 이름, 분류(m 식사 s 간식 d 음료), 원, kcal, 단백질 g, 나트륨 mg, 첨가당 g, 칼슘 mg, 식이섬유 g, 카페인 mg */
const FOODS = [
  ['lunch','🍚','학교 급식 한 끼','m',0,720,30,900,5,200,9,0],
  ['home','🏠','집밥(현미밥·된장국·달걀말이·나물)','m',3500,620,26,800,3,180,8,0],
  ['dosirak','🍱','편의점 도시락(제육)','m',5000,780,28,1400,10,80,5,0],
  ['ramen','🍜','컵라면(큰컵)','m',1500,480,10,1700,3,100,2,0],
  ['tri','🍙','삼각김밥(참치마요)','m',1300,210,5,450,2,15,1,0],
  ['gimbap','🥢','김밥 한 줄','m',3500,450,13,1000,4,50,4,0],
  ['tteok','🌶️','떡볶이 1인분','m',4000,480,10,1300,15,60,3,0],
  ['burger','🍔','햄버거 세트(감자튀김·콜라)','m',7500,1050,28,1300,42,150,5,25],
  ['chicken','🍗','후라이드 치킨 반 마리','m',9000,900,60,1300,2,50,1,0],
  ['sand','🥪','통밀 샌드위치(달걀·채소)','m',3800,360,17,680,4,110,5,0],
  ['salad','🥗','닭가슴살 샐러드','m',5500,280,28,520,4,70,5,0],
  ['hotbar','🌭','소시지 핫바','s',2000,200,8,500,3,20,0,0],
  ['eggs','🥚','삶은 달걀 2개','s',1800,150,13,140,0,50,0,0],
  ['yog','🥣','무가당 요거트+견과','s',2500,220,12,60,0,150,3,0],
  ['banana','🍌','바나나 1개','s',800,95,1,1,0,6,2.5,0],
  ['apple','🍎','사과 1개','s',1200,130,0,0,0,10,4,0],
  ['goguma','🍠','군고구마 1개','s',2000,180,2,15,0,35,4,0],
  ['chips','🥔','감자칩 한 봉지','s',1700,330,3,300,1,10,2,0],
  ['choco','🍫','초코바','s',1500,250,4,80,24,50,1,0],
  ['shake','🥤','단백질 셰이크(1회분)','d',3000,150,25,150,2,60,1,0],
  ['milk','🥛','흰 우유 200 mL','d',1100,130,6,100,0,200,0,0],
  ['cmilk','🧃','커피우유 300 mL','d',1800,190,8,150,20,250,0,70],
  ['energy','⚡','에너지음료 355 mL','d',2000,160,0,110,38,0,0,100],
  ['cola','🥤','콜라 355 mL','d',1500,152,0,15,38,0,0,34],
  ['ame','☕','아이스 아메리카노','d',2500,10,0,5,0,5,0,150],
  ['bubble','🧋','흑당 버블티','d',4500,400,4,80,45,60,0,40],
  ['water','💧','물·보리차','d',0,0,0,0,0,0,0,0]
].map(a => ({ id: a[0], e: a[1], n: a[2], c: a[3], won: a[4], kcal: a[5], pro: a[6], na: a[7], sug: a[8], ca: a[9], fib: a[10], caf: a[11] }));
/* 식품군: 식품구성자전거의 6개 식품군 가운데 유지·당류를 뺀 5개(수업용 분류, 영양교사 검수 대상).
   2025 섭취기준의 식사구성안은 '활용편'으로 따로 나올 예정이라 그 전까지 기존 분류를 따른다. 판정에는 넣지 않는다. */
const FG_NAMES = ["곡류", "고기·생선·달걀·콩류", "채소류", "과일류", "우유·유제품류"];
const FG = { lunch: [0, 1, 2], home: [0, 1, 2], dosirak: [0, 1], ramen: [0], tri: [0, 1], gimbap: [0, 1, 2], tteok: [0], burger: [0, 1], chicken: [1],
  sand: [0, 1, 2], salad: [1, 2], hotbar: [1], eggs: [1], yog: [4], banana: [3], apple: [3], goguma: [0], milk: [4], cmilk: [4] };
FOODS.forEach(f => { f.g = FG[f.id] || []; });
const F = Object.fromEntries(FOODS.map(f => [f.id, f]));
function groups(tray) { const g = new Set(); for (const id in tray) if (tray[id] && F[id]) F[id].g.forEach(x => g.add(x)); return [...g].sort(); }
const KEYS = ["won", "kcal", "pro", "na", "sug", "ca", "fib", "caf"];
function totals(tray) { const t = { n: 0 }; KEYS.forEach(k => t[k] = 0);
  for (const id in tray) { const f = F[id], k = tray[id]; if (!f || !k) continue; t.n += k; KEYS.forEach(x => t[x] += f[x] * k); } return t; }

/* 공통 AI 알림 (모든 의뢰인) — a: 제안 판정, ok: 일리 있는 다른 판정(-1이면 없음). 0 수용, 1 검증·보완 후 사용, 2 거부 */
const CH = ["수용", "검증·보완 후 사용", "거부"];
const COMMON_AI = [
  { msg: "📷 사진 분석 완료: \"샐러드, 150 kcal\"", ctx: "실제 음식은 크림 드레싱과 튀긴 치킨 토핑이 올라간 샐러드였다.", a: 1, ok: -1,
    why: "사진 인식은 음식 종류는 맞혀도 양, 조리법, 드레싱처럼 보이지 않는 재료에서 오차가 큽니다. 기록하는 수고를 덜어 주는 장점은 살리되, 사람이 값을 확인하고 고쳐야 합니다." },
  { msg: "🚀 \"2주 집중 플랜\": 하루 900 kcal만 먹으면 목표를 가장 빨리 이룰 수 있어요!", ctx: "앱의 목표가 '빠른 변화'로 설정되어 있다.", a: 2, ok: -1,
    why: "900 kcal는 15~18세 에너지필요추정량(남 2,700, 여 2,000 kcal)의 33~45%에 그칩니다. 성장기의 극단적인 제한은 영양 결핍과 섭식 문제의 위험을 키웁니다. AI는 주어진 목표 하나만 좇을 수 있고, 그 목표가 건강한지는 사람이 판단해야 합니다." },
  { msg: "🎁 식단·심박·수면 기록을 제휴 광고사에 제공하는 데 '전체 동의'하면 프리미엄 1개월 무료!", ctx: "약관은 4,000자이고, 제공 기간은 '서비스 종료 시까지'다.", a: 2, ok: 1,
    why: "건강에 관한 정보는 개인정보 보호법에서 민감정보로 다루며, 따로 동의를 받아야 합니다. 빅데이터는 많은 사람의 기록이 모일 때 쓸모가 커지지만, 목적·범위·기간이 불분명한 전체 동의는 거부하거나, 무엇을 누구에게 언제까지 주는지 확인한 뒤 결정해야 합니다." }];

/* 의뢰인(가상). 체중(kg)은 카페인 권고량 계산에만 쓴다. now: 어제 먹은 것(현재 식단) — 문항·그래프의 '어제' 값과 같아야 한다 */
const P = {
  A: { id: "A", name: "준서", ava: "🧑‍🎓", tint: "sky", sex: "남", grade: "고2", kg: 62, tag: "고2 · 시험 2주 전", issue: "카페인·첨가당",
    quote: "에너지음료 없으면 못 버텨요. 그런데 요즘 심장이 두근거리고 새벽 3시까지 잠이 안 와요.",
