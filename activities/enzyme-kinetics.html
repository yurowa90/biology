<!--
  효소반응속도 학습 워크북 — 미카엘리스-멘텐 (Michaelis–Menten)
  단일 파일 정적 웹앱. GitHub Pages 등 어떤 정적 호스팅에도 그대로 올리면 동작합니다.
  서버(백엔드)가 전혀 필요 없고, API 키·비밀값도 쓰지 않습니다.
  - 제출 방식은 아래 CONFIG.submit 에서 선택합니다.
      "download"(기본, 설정 불필요) · "googleForm"(구글 폼, Apps Script 아님) · "endpoint"(임의 POST URL)
  - 서술형 피드백은 모두 이 브라우저 안에서 만듭니다(네트워크 호출 없음):
      키워드 루브릭 자가 점검 · 예시 답안(60자 이상 작성 후 열람, 열람 기록은 보고서에 남음)
      · (선택) 'AI 도우미용 프롬프트 복사' — 클립보드 복사만 함. CONFIG.showPromptCopy 로 끄고 켭니다.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>효소반응속도 학습 워크북 · 미카엘리스-멘텐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1626'/%3E%3Cpath d='M5 26C9 12 15 8 27 7' fill='none' stroke='%2345d3d8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#070b14; --bg2:#0a1120; --panel:#0e1626; --panel2:#111d31;
    --line:#1d2b41; --line2:#26374f;
    --txt:#e6edf6; --muted:#7e8da0; --faint:#586479;
    --cyan:#45d3d8; --cyan2:#63e6ea; --cyandim:#1c5a5e;
    --green:#33d17f; --amber:#f2c14e; --violet:#a98bff; --red:#ff6b7d; --blue:#5aa9ff;
    --mono:ui-monospace,SFMono-Regular,Menlo,"Cascadia Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans); color:var(--txt);
    background:radial-gradient(1200px 700px at 78% -8%,#122036 0,transparent 55%),
               radial-gradient(900px 600px at 5% 0,#0d1a2c 0,transparent 50%),
               linear-gradient(180deg,#070b14,#060910 60%);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--cyan)}
  .mono{font-family:var(--mono)}
  .hidden{display:none !important}

  /* ---------- header ---------- */
  header.top{
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    padding:14px 26px; border-bottom:1px solid var(--line);
    background:rgba(8,13,22,.7); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:20;
  }
  .brand{font-family:var(--mono); font-size:11.5px; letter-spacing:.22em; color:var(--faint); white-space:nowrap}
  .brand b{color:var(--cyan)}
  .title{font-size:18px; font-weight:700}
  .title span{color:var(--cyan)}
  .top-right{margin-left:auto; display:flex; align-items:center; gap:16px}
  .who{font-size:13px; color:var(--muted)}
  .who b{color:var(--txt)}
  .btn-exit{font-family:var(--mono); font-size:11px; letter-spacing:.12em; padding:7px 13px;
    border:1px solid var(--line2); border-radius:8px; background:transparent; color:var(--muted); cursor:pointer}
  .btn-exit:hover{color:var(--txt); border-color:var(--cyandim)}

  /* ---------- layout ---------- */
  .wrap{display:grid; grid-template-columns:270px minmax(0,1fr); gap:26px; max-width:1240px; margin:0 auto; padding:26px 26px 70px}
  @media(max-width:880px){ .wrap{grid-template-columns:minmax(0,1fr)} nav.steps{position:static !important} }
  @media(max-width:560px){
    header.top{padding:12px 14px; gap:6px 14px}
    .top-right{gap:10px}
    .wrap{padding:16px 14px 60px}
    .panel{padding:20px 16px 18px !important; border-radius:14px !important}
    h1.h{font-size:23px !important}
    .qcard{padding:14px 13px !important}
  }

  /* ---------- sidebar ---------- */
  nav.steps{position:sticky; top:78px; align-self:start; display:flex; flex-direction:column; gap:10px}
  .step{
    display:flex; align-items:center; gap:13px; text-align:left;
    padding:13px 15px; border:1px solid var(--line); border-radius:13px;
    background:linear-gradient(180deg,#0d1626,#0b1320); color:var(--muted); cursor:pointer; width:100%;
    transition:border-color .15s, transform .05s;
  }
  .step:hover{border-color:var(--line2)}
  .step:active{transform:translateY(1px)}
  .step .num{
    flex:0 0 26px; width:26px; height:26px; border-radius:50%;
    border:1.5px solid var(--line2); display:grid; place-items:center;
    font-family:var(--mono); font-size:12.5px; color:var(--muted);
  }
  .step .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--faint)}
  .step .nm{font-size:14px; font-weight:600; margin-top:2px; color:var(--muted)}
  .step.active{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyandim) inset, 0 8px 30px -18px var(--cyan)}
  .step.active .num{border-color:var(--cyan); color:var(--cyan)}
  .step.active .nm{color:var(--txt)}
  .step.done .num{background:var(--green); border-color:var(--green); color:#04240f}
  .step.done .nm{color:#bfeed4}

  /* ---------- panel ---------- */
  .panel{
    border:1px solid var(--line); border-radius:18px; padding:30px 34px 26px;
    background:linear-gradient(180deg,rgba(16,24,40,.9),rgba(9,15,26,.9));
    box-shadow:0 30px 80px -50px #000;
  }
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--cyan); margin-bottom:12px}
  h1.h{font-size:29px; margin:0 0 8px; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:15px; line-height:1.6; margin:0 0 24px; max-width:70ch}
  .foot{display:flex; align-items:center; justify-content:space-between; margin-top:28px; gap:14px; flex-wrap:wrap}
  .note{color:var(--faint); font-size:12.5px}
  .btn{font-size:14px; font-weight:600; padding:11px 20px; border-radius:11px; cursor:pointer; border:1px solid transparent}
  .btn-prev{background:transparent; border-color:var(--line2); color:var(--muted)}
  .btn-prev:hover{color:var(--txt); border-color:var(--cyandim)}
  .btn-next{background:linear-gradient(180deg,#1a6f74,#12545a); border-color:#1f8288; color:#e7fdff; box-shadow:0 10px 30px -14px var(--cyan)}
  .btn-next:hover{filter:brightness(1.08)}
  .btn-next:disabled{opacity:.4; cursor:not-allowed; box-shadow:none}
  .btn-sm{font-size:12.5px; padding:8px 13px; border-radius:9px}
  .btn-check{background:linear-gradient(180deg,#12545a,#0e444a); border-color:#1f8288; color:#dffbff}
  .btn-check:hover{filter:brightness(1.1)}
  .btn-ghost{background:transparent; border-color:var(--line2); color:var(--muted)}
  .btn-ghost:hover:not(:disabled){color:var(--txt); border-color:var(--cyandim)}
  .btn:disabled{opacity:.45; cursor:not-allowed}

  /* ---------- formula / chips ---------- */
  .kbd{font-family:var(--mono); font-size:.92em; background:#0c1728; border:1px solid var(--line2); border-radius:6px; padding:1px 6px; color:var(--cyan2)}
  .fx{font-family:"Cambria Math",Georgia,serif; font-size:1.14em}
  .fx sub,.fx sup{font-size:.72em}

  /* ---------- MCQ ---------- */
  .qcard{border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; background:rgba(10,17,30,.6)}
  .qh{font-size:15.5px; font-weight:600; margin-bottom:14px; line-height:1.5}
  .qh .qn{color:var(--cyan); font-family:var(--mono); margin-right:8px}
  .opt{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:14px 16px; border:1px solid var(--line); border-radius:11px; margin-bottom:10px;
    background:linear-gradient(180deg,#0c1524,#0a1220); color:var(--txt); cursor:pointer; font-size:14.5px;
    transition:border-color .12s, background .12s;
  }
  .opt:last-child{margin-bottom:0}
  .opt:hover{border-color:var(--line2)}
  .opt .k{flex:0 0 26px; width:26px; height:26px; border-radius:7px; border:1px solid var(--line2);
    display:grid; place-items:center; font-family:var(--mono); font-size:12px; color:var(--muted)}
  .opt.sel{border-color:var(--cyan); background:linear-gradient(180deg,#0e2733,#0b1c27)}
  .opt.sel .k{background:var(--cyan); border-color:var(--cyan); color:#04222a}
  .opt.correct{border-color:var(--green); background:linear-gradient(180deg,#0d2419,#0a1c15)}
  .opt.correct .k{background:var(--green); border-color:var(--green); color:#04240f}
  .opt.wrong{border-color:var(--red); background:linear-gradient(180deg,#2a1216,#1c0e12)}
  .opt.wrong .k{background:var(--red); border-color:var(--red); color:#2a0006}
  .expl{font-size:13px; color:var(--muted); margin-top:10px; padding:10px 13px; border-left:2px solid var(--cyandim); background:rgba(69,211,216,.05); border-radius:0 8px 8px 0; line-height:1.55}
  .expl.hidden{display:none}

  /* ---------- derivation accordion ---------- */
  .prep{border:1px solid var(--line2); border-radius:12px; padding:16px 18px; margin-bottom:18px; background:linear-gradient(180deg,#0d1c2b,#0b1624)}
  .prep .tag{font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:var(--cyan); margin-bottom:8px}
  .prep p{margin:0; font-size:14px; line-height:1.7; color:#cdd8e6}
  .acc{border:1px solid var(--line); border-radius:12px; margin-bottom:11px; overflow:hidden; background:rgba(10,17,30,.5)}
  .acc-h{display:flex; align-items:center; gap:14px; padding:15px 17px; cursor:pointer}
  .acc-h .an{flex:0 0 26px; width:26px; height:26px; border-radius:50%; background:#0c1c2a; border:1px solid var(--cyandim);
    display:grid; place-items:center; font-family:var(--mono); font-size:12px; color:var(--cyan)}
  .acc-h .at{font-weight:600; font-size:15px}
  .acc-h .caret{margin-left:auto; color:var(--faint); transition:transform .18s}
  .acc.open .caret{transform:rotate(90deg)}
  .acc-b{padding:0 18px; max-height:0; overflow:hidden; transition:max-height .25s ease, padding .2s}
  .acc.open .acc-b{padding:2px 18px 18px; max-height:420px}
  .acc-b p{font-size:14px; line-height:1.7; color:#cdd8e6; margin:6px 0}
  .eqbox{background:#0a1524; border:1px solid var(--line2); border-radius:10px; padding:16px; text-align:center; margin:10px 0}
  .eqbox .fx{font-size:1.24em}

  /* ---------- concept callouts ---------- */
  .thrust{background:linear-gradient(180deg,#0e1a2b,#0b1421); border:1px solid var(--line2); border-radius:12px; padding:20px; text-align:center; margin-bottom:20px}
  .thrust .lab{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--amber); margin-bottom:8px}
  .thrust .fx{font-size:1.5em}
  .call{border-left:3px solid var(--violet); background:rgba(169,139,255,.06); border-radius:0 10px 10px 0; padding:14px 18px; margin-bottom:12px}
  .call.amber{border-color:var(--amber); background:rgba(242,193,78,.06)}
  .call .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--violet); margin-bottom:6px}
  .call.amber .ct{color:var(--amber)}
  .call p{margin:0; font-size:14px; line-height:1.65; color:#d3dce8}

  /* ---------- simulator ---------- */
  .sim{display:grid; grid-template-columns:1fr 300px; gap:20px}
  @media(max-width:820px){ .sim{grid-template-columns:1fr} }
  .canvas-wrap{border:1px solid var(--line); border-radius:12px; background:#080f1b; padding:12px; position:relative}
  .canvas-cap{font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--faint); margin-bottom:6px; display:flex; justify-content:space-between}
  canvas{width:100%; display:block; border-radius:8px}
  .ctrl{border:1px solid var(--line); border-radius:12px; padding:16px; background:linear-gradient(180deg,#0e1626,#0b1220)}
  .ctrl-row{display:flex; gap:10px; margin-bottom:14px}
  .csmall{flex:1; font-family:var(--mono); font-size:11px; letter-spacing:.08em; padding:9px; border-radius:9px; border:1px solid var(--line2); background:#0c1524; color:var(--muted); cursor:pointer}
  .csmall:hover{color:var(--txt); border-color:var(--cyandim)}
  .csmall.go{background:linear-gradient(180deg,#12545a,#0e444a); border-color:#1f8288; color:#dffbff}
  .sld{margin-bottom:15px}
  .sld label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px}
  .sld label .v{font-family:var(--mono); color:var(--cyan2)}
  .sld input[type=range]{width:100%; accent-color:var(--cyan)}
  .seg{display:flex; gap:6px; margin-top:5px}
  .seg button{flex:1; font-size:12px; padding:8px 4px; border-radius:8px; border:1px solid var(--line2); background:#0c1524; color:var(--muted); cursor:pointer}
  .seg button.on{background:#12545a; border-color:#1f8288; color:#dffbff}
  .chk{font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; margin-top:9px}
  .chk .box{width:16px; height:16px; border-radius:5px; border:1px solid var(--line2); display:grid; place-items:center; font-size:11px; color:transparent}
  .chk.on .box{background:var(--green); border-color:var(--green); color:#04240f}
  .chk.on{color:#bfeed4}

  .readouts{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px; margin-top:18px}
  @media(max-width:560px){ .readouts{grid-template-columns:1fr 1fr} }
  .ro{border:1px solid var(--line); border-radius:11px; padding:12px 13px; background:rgba(10,17,30,.55)}
  .ro .rk{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--faint); margin-bottom:4px; text-transform:uppercase}
  .ro .rv{font-family:var(--mono); font-size:20px; font-weight:600}
  .ro .ru{font-size:11px; color:var(--muted); margin-left:3px}
  .big-read{border:1px solid var(--cyandim); border-radius:12px; padding:15px 18px; background:linear-gradient(180deg,#0c1f28,#0a1822); margin-top:18px}
  .big-read .rk{font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--faint); text-transform:uppercase}
  .big-read .rv{font-family:var(--mono); font-size:30px; font-weight:700; color:var(--cyan2)}
  .big-read .hint{font-size:12px; color:var(--muted); margin-top:2px}

  /* ---------- 서술형 · 자가 점검 (모두 로컬, 네트워크 없음) ---------- */
  .essay textarea{width:100%; min-height:120px; resize:vertical; font-family:var(--sans); font-size:14px; line-height:1.6;
    padding:13px 15px; border-radius:11px; border:1px solid var(--line2); background:#0a1220; color:var(--txt)}
  .essay textarea:focus{outline:none; border-color:var(--cyandim)}
  .essay-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:10px}
  .tools{display:flex; gap:8px; flex-wrap:wrap}
  .cc{font-size:12px; color:var(--faint); font-family:var(--mono)}
  .gate{font-size:12px; color:var(--faint); margin-top:8px; line-height:1.5}
  .gate.seen{color:#f7dfa0}
  .sc-out,.ex-out,.pc-out{margin-top:12px; border:1px solid var(--line2); border-radius:11px; padding:14px 16px; background:rgba(10,17,30,.6)}
  .sc-out{border-color:var(--cyandim); background:rgba(69,211,216,.05)}
  .ex-out{border-color:#6a5320; background:rgba(242,193,78,.06)}
  .sc-head,.ex-head,.pc-head{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--cyan); margin-bottom:6px}
  .ex-head{color:var(--amber)} .pc-head{color:var(--muted)}
  .sc-score{color:var(--amber)}
  .sc-note{font-size:12px; color:var(--muted); line-height:1.55; margin-bottom:10px}
  .sc-list{list-style:none; margin:0; padding:0}
  .sc-list li{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px; line-height:1.55}
  .sc-list li:first-child{border-top:none}
  .sc-list .mk{flex:0 0 22px; width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:12px; font-weight:700}
  .sc-list li.ok .mk{background:var(--green); color:#04240f}
  .sc-list li.miss .mk{background:transparent; border:1px solid var(--amber); color:var(--amber)}
  .sc-list li.ok .sl{color:#bfeed4}
  .sc-list .sh{font-size:12.5px; color:var(--muted); margin-top:2px}
  .sc-stale{font-size:12px; color:var(--amber); margin-top:8px}
  .ex-body{font-size:14px; line-height:1.75; color:#efe6c8; white-space:pre-wrap}
  .ex-note{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5}
  .pc-out textarea{width:100%; min-height:150px; font-family:var(--mono); font-size:12px; line-height:1.5; padding:10px 12px; border-radius:9px; border:1px solid var(--line2); background:#0a1220; color:var(--txt); resize:vertical}
  .pc-note{font-size:12px; color:var(--muted); margin:8px 0; line-height:1.5}

  /* ---------- report ---------- */
  .rsec{border:1px solid var(--line); border-radius:13px; padding:18px 20px; margin-bottom:16px; background:rgba(10,17,30,.5)}
  .rsec .rt{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--cyan); margin-bottom:14px; display:flex; justify-content:space-between}
  .rsec .rt .score{color:var(--amber)}
  .idgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
  @media(max-width:640px){ .idgrid{grid-template-columns:1fr 1fr} }
  .idcell{border:1px solid var(--line); border-radius:10px; padding:11px 13px; background:#0a1220}
  .idcell .il{font-size:10px; color:var(--faint); font-family:var(--mono); margin-bottom:5px; text-transform:uppercase}
  .idcell input{width:100%; background:transparent; border:none; color:var(--txt); font-size:18px; font-family:var(--mono); font-weight:600}
  .idcell input:focus{outline:none}
  .idcell .big{font-size:22px; font-family:var(--mono); font-weight:700}
  .qline{margin-bottom:14px; font-size:14px; line-height:1.55}
  .qline .qq{color:#c6d2e2}
  .qline .ans{display:block; margin-top:4px}
  .ans .lab{font-weight:700}
  .ans .ok{color:var(--green)} .ans .no{color:var(--red)} .ans .neu{color:var(--muted)}
  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); opacity:0;
    background:#0e2733; border:1px solid var(--cyandim); color:#dffbff; padding:12px 20px; border-radius:11px;
    font-size:14px; transition:.25s; z-index:60; box-shadow:0 20px 50px -20px #000}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast.err{background:#2a1216; border-color:#5a2530; color:#ffd7dc}

  /* ---------- intro modal ---------- */
  .modal{position:fixed; inset:0; background:rgba(4,7,12,.82); backdrop-filter:blur(5px); display:grid; place-items:center; z-index:80; padding:20px}
  .modal .card{width:min(440px,100%); border:1px solid var(--line2); border-radius:18px; padding:30px; background:linear-gradient(180deg,#0f1930,#0a1120)}
  .modal h2{margin:0 0 4px; font-size:22px}
  .modal p{margin:0 0 22px; color:var(--muted); font-size:14px; line-height:1.6}
  .modal .field{margin-bottom:15px}
  .modal .field label{display:block; font-size:12px; color:var(--faint); font-family:var(--mono); letter-spacing:.1em; margin-bottom:6px; text-transform:uppercase}
  .modal .field input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line2); background:#0a1220; color:var(--txt); font-size:15px}
  .modal .field input:focus{outline:none; border-color:var(--cyan)}

  @media print{
    body{background:#fff; color:#000}
    header.top, nav.steps, .foot, .top-right, .modal{display:none !important}
    .wrap{display:block; max-width:none; padding:0}
    .panel{border:none; box-shadow:none; background:#fff}
    .rsec{border:1px solid #ccc; background:#fff; break-inside:avoid}
    .rt, .eyebrow{color:#000 !important}
  }
</style>

<header class="top">
  <div class="brand"><b>Vmax</b> · MICHAELIS–MENTEN · WORKBOOK</div>

  HIGH: "(?:높은|높을|높으|큰\\s|클\\s*때|많은|많을|많으|≫|>>|과량|high)"

// a 와 b 가 같은 문장 안에서 gap 글자 이내로 이어지는지(사이에 stop 토큰이 끼면 안 됨)
function near(a, b, gap, stop){
  const mid = stop ? `(?:(?!${stop})[^.。!?\\n]){0,${gap}}` : `[^.。!?\\n]{0,${gap}}`;
  return new RegExp(a + mid + b, "i");
}

// 서술 2: 답안을 '경쟁적'을 다룬 부분과 '비경쟁적'을 다룬 부분으로 나눕니다.
//  ① 언급 위치를 기준으로 다음 언급 전까지를 한 구간으로 보고, ② 한쪽만 언급한 절(문장·쉼표 단위)도 더합니다.
function inhibitorScopes(text){
  const t = String(text||""); const marks = []; const re = /(비\s*)?경쟁\s*(?:적|형)|(non[\s-]*)?competitive/gi; let m;
  while((m = re.exec(t))){ marks.push({i:m.index, k:(m[1]||m[2]) ? "noncomp" : "comp"}); }
  if(!marks.length) return {all:t, comp:t, noncomp:t};
  const pre = t.slice(0, marks[0].i); const out = {all:t, comp:pre, noncomp:pre};
  marks.forEach((mk,j)=>{ out[mk.k] += "\n" + t.slice(mk.i, j+1<marks.length ? marks[j+1].i : t.length); });
  t.split(/[.。!?\n,;]|지만|반면|반해|한편/).forEach(cl=>{
    const c = /(^|[^비\s])\s*경쟁\s*(?:적|형)|^\s*경쟁\s*(?:적|형)/.test(cl), n = /비\s*경쟁\s*(?:적|형)|non[\s-]*competitive/i.test(cl);
    if(c && !n) out.comp += "\n" + cl; else if(n && !c) out.noncomp += "\n" + cl;
  });
  return out;
}
function runRubric(k, text){
  const t = String(text||"").normalize("NFC");
  const scopes = k==="s2" ? inhibitorScopes(t) : {all:t};
  const items = ESSAY_RUBRIC[k].map(c=>{
    const s = scopes[c.scope||"all"] || t;
    const ok = c.all ? c.all.every(g=>g.some(r=>r.test(s))) : c.any.some(r=>r.test(s));
    return {id:c.id, label:c.label, hint:c.hint, ok};
  });
  const met = items.filter(x=>x.ok).length;
  return {items, met, total:items.length};
}

    + "Km은 v = Vmax/2가 되는 기질 농도(반포화 농도)이므로, [S]가 Km보다 훨씬 작은지 큰지가 두 영역을 나누는 기준이 된다.",

    + "비경쟁적 억제제는 활성 부위가 아닌 다른 자리(알로스테릭 부위)에 결합해 효소의 구조를 바꾸어 촉매 작용이 일어나지 못하게 한다. 억제제가 붙은 효소는 일을 하지 못해 작동하는 효소의 양이 줄어든 것과 같으므로 Vmax가 감소하고, 기질 농도를 높여도 회복되지 않는다. 남아 있는 정상 효소가 기질과 결합하는 정도는 그대로이므로 Km은 변하지 않는다(순수 비경쟁적 억제).\n\n"
    + "이중역수 식 1/v = (Km/Vmax)·(1/[S]) + 1/Vmax 로 보면, 경쟁적 억제제는 y절편(1/Vmax)은 그대로이고 기울기(Km/Vmax)가 커지며 x절편(−1/Km)이 원점 쪽으로 옮겨 간다. 비경쟁적 억제제는 y절편이 커지고(1/Vmax 증가) 기울기도 커지지만 x절편(−1/Km)은 그대로다. 따라서 억제제가 있을 때와 없을 때의 직선은 경쟁적이면 y축 위에서, 비경쟁적이면 x축 위에서 만난다."
};

let simAnim = null, simSweep = null;
function computeApparent(){
  const {Vmax,Km,inh,istr} = state.sim;
  const alpha = 1 + istr;               // istr: 0..4
  let KmA = Km, VmaxA = Vmax;
  if(inh==="comp") KmA = Km*alpha;
  else if(inh==="noncomp") VmaxA = Vmax/alpha;
  return {KmA, VmaxA};
}
function vAt(S){
  const {KmA, VmaxA} = computeApparent();
  return VmaxA*S/(KmA+S);
}

window.togglePlot = ()=>{ plotMode = plotMode==="mm"?"lb":"mm"; simUpdate(); };

function simUpdate(){
  if(!document.getElementById("roV")){ if(simSweep){clearInterval(simSweep);simSweep=null;} return; }
  const {Vmax,Km,S,inh,istr} = state.sim;
  const {KmA,VmaxA} = computeApparent();
  const v = vAt(S);
  // labels
  $("#lVmax").textContent = Vmax.toFixed(1)+" μM/s";
  $("#lKm").textContent   = Km+" mM";
  $("#lS").textContent    = S+" mM";
  $("#lIstr").textContent = "×"+(1+istr).toFixed(1);
  $("#istrWrap").style.opacity = inh==="none"?".4":"1";
  document.querySelectorAll("#segInh button").forEach(b=>b.classList.toggle("on", b.dataset.v===inh));
  // readouts
  $("#roV").textContent = v.toFixed(2)+" μM/s";
  $("#roVmax").textContent = VmaxA.toFixed(1);
  $("#roKm").textContent = KmA.toFixed(1);
  $("#roFrac").innerHTML = (100*v/VmaxA).toFixed(0)+'<span class="ru">%</span>';
  $("#roRatio").textContent = (S/KmA).toFixed(2);
  const ratio = S/KmA;
  $("#roOrder").textContent = ratio<0.2 ? "≈ 1차" : ratio>5 ? "≈ 0차" : "혼합";
  $("#roInh").textContent = {none:"없음",comp:"경쟁적",noncomp:"비경쟁적"}[inh];
  $("#roVhint").textContent = ratio>5 ? "효소가 포화되었습니다 — [S]를 더 늘려도 v는 거의 그대로."
      : ratio<0.2 ? "낮은 [S] — v가 [S]에 거의 비례합니다." : "반포화 부근 — Km 근처입니다.";
  // checklist
  $("#chkHalf").classList.toggle("on", S>=KmA);
  $("#chkSat").classList.toggle("on", v>=0.95*VmaxA);
  // plot
  $("#capPlot").textContent = plotMode==="mm" ? "v–[S] 곡선 · SATURATION" : "이중역수 · LINEWEAVER–BURK";
  $("#plotToggle").textContent = plotMode==="mm" ? "↔ 이중역수 보기" : "↔ 직접 곡선 보기";
  drawPlot();
}

/* --- plot drawing --- */
function drawPlot(){
  const c=$("#cvPlot"); if(!c) return; const ctx=c.getContext("2d");
  const W=c.width, H=c.height; ctx.clearRect(0,0,W,H);
  const {Vmax} = state.sim; const {KmA,VmaxA} = computeApparent();
  const pad={l:52,r:16,t:16,b:38};
  const gx=v=>pad.l+(W-pad.l-pad.r)*v, gy=v=>H-pad.b-(H-pad.t-pad.b)*v;
  // axes
  ctx.strokeStyle="#26374f"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,H-pad.b); ctx.lineTo(W-pad.r,H-pad.b); ctx.stroke();
  ctx.fillStyle="#7e8da0"; ctx.font="11px ui-monospace,monospace";

  if(plotMode==="mm"){
    const yMax = Vmax*Vaxis_pad;
    // grid + labels
    ctx.textAlign="right"; ctx.textBaseline="middle";
    for(let i=0;i<=4;i++){ const yv=yMax*i/4; const y=gy(i/4);
      ctx.strokeStyle="#15202f"; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
      ctx.fillText(yv.toFixed(1), pad.l-8, y); }
    ctx.textAlign="center"; ctx.textBaseline="top";
    for(let i=0;i<=4;i++){ const xv=S_MAX*i/4; const x=gx(i/4); ctx.fillText(xv, x, H-pad.b+8); }
    ctx.fillStyle="#586479"; ctx.textAlign="left"; ctx.fillText("[S] (mM)", W-pad.r-64, H-pad.b+8);
    ctx.save(); ctx.translate(14,pad.t+8); ctx.rotate(-Math.PI/2); ctx.fillText("v (μM/s)",-70,0); ctx.restore();
    // uninhibited faded reference
    if(state.sim.inh!=="none"){
      ctx.strokeStyle="rgba(126,141,160,.35)"; ctx.lineWidth=1.4; ctx.setLineDash([5,4]); ctx.beginPath();
      for(let px=0;px<=1;px+=.01){ const S=px*S_MAX; const v=Vmax*S/(state.sim.Km+S); const X=gx(px),Y=gy(v/yMax); px===0?ctx.moveTo(X,Y):ctx.lineTo(X,Y);} ctx.stroke(); ctx.setLineDash([]);
    }
    // Vmax asymptote
    ctx.strokeStyle="rgba(242,193,78,.5)"; ctx.setLineDash([6,5]); ctx.beginPath();
    ctx.moveTo(pad.l,gy(VmaxA/yMax)); ctx.lineTo(W-pad.r,gy(VmaxA/yMax)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#f2c14e"; ctx.textAlign="left"; ctx.fillText("Vmax", W-pad.r-40, gy(VmaxA/yMax)-12);
    // half-Vmax + Km marker
    const KmX = Math.min(KmA/S_MAX,1);
    ctx.strokeStyle="rgba(69,211,216,.35)"; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(pad.l,gy(VmaxA/2/yMax)); ctx.lineTo(gx(KmX),gy(VmaxA/2/yMax)); ctx.lineTo(gx(KmX),H-pad.b); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#45d3d8"; ctx.fillText("Km", gx(KmX)+4, gy(VmaxA/2/yMax)-4);
    // main curve
    ctx.strokeStyle="#45d3d8"; ctx.lineWidth=2.4; ctx.beginPath();
    for(let px=0;px<=1;px+=.005){ const S=px*S_MAX; const v=vAt(S); const X=gx(px),Y=gy(v/yMax); px===0?ctx.moveTo(X,Y):ctx.lineTo(X,Y);} ctx.stroke();
    // moving point
    const px=Math.min(state.sim.S/S_MAX,1), v=vAt(state.sim.S);
    ctx.fillStyle="#63e6ea"; ctx.beginPath(); ctx.arc(gx(px),gy(v/yMax),6,0,7); ctx.fill();
    ctx.strokeStyle="#082"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(gx(px),gy(v/yMax)); ctx.lineTo(gx(px),H-pad.b); ctx.strokeStyle="rgba(99,230,234,.4)"; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
  } else {
    // Lineweaver–Burk : 1/v = (Km/Vmax)(1/S) + 1/Vmax
    const xMax = 4/KmA;            // 1/S axis
    const slopeU = state.sim.Km/state.sim.Vmax, intU = 1/state.sim.Vmax;
    const slope = KmA/VmaxA, inty = 1/VmaxA;
    const yMax = Math.max(inty + slope*xMax, intU + slopeU*xMax)*1.05;
    const zeroX = gx(0.18); // x for 1/S = 0, shifted right so negative x-intercept shows
    const spanX = W-pad.r-zeroX;
    const gx2 = inv=>zeroX+spanX*(inv/xMax);
    const gy2 = val=>H-pad.b-(H-pad.t-pad.b)*(val/yMax);
    // axes crossing at x=0
    ctx.strokeStyle="#26374f"; ctx.beginPath(); ctx.moveTo(zeroX,pad.t); ctx.lineTo(zeroX,H-pad.b); ctx.stroke();
    ctx.fillStyle="#586479"; ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillText("1/[S]", W-pad.r-30, H-pad.b+8);
    ctx.save(); ctx.translate(14,pad.t+8); ctx.rotate(-Math.PI/2); ctx.fillText("1/v",-40,0); ctx.restore();
    // reference (uninhibited)
    if(state.sim.inh!=="none"){
      ctx.strokeStyle="rgba(126,141,160,.4)"; ctx.lineWidth=1.5; ctx.setLineDash([5,4]); ctx.beginPath();
      ctx.moveTo(gx2(-intU/slopeU), gy2(0)); ctx.lineTo(gx2(xMax), gy2(intU+slopeU*xMax)); ctx.stroke(); ctx.setLineDash([]);
    }
    // main line
    ctx.strokeStyle="#45d3d8"; ctx.lineWidth=2.4; ctx.beginPath();
    ctx.moveTo(gx2(-inty/slope), gy2(0)); ctx.lineTo(gx2(xMax), gy2(inty+slope*xMax)); ctx.stroke();
    // intercept markers
    ctx.fillStyle="#63e6ea"; ctx.beginPath(); ctx.arc(zeroX, gy2(inty),5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(gx2(-inty/slope), gy2(0),5,0,7); ctx.fill();
    ctx.fillStyle="#7e8da0"; ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText("y절편 = 1/Vmax", zeroX+8, gy2(inty)-10);
    ctx.fillText("x절편 = −1/Km", gx2(-inty/slope)-6, gy2(0)+16);
  }
}

/* --- scene animation --- */
let scene = {parts:[], tovDisplay:0, t:0};
function startScene(){
  if(simAnim) cancelAnimationFrame(simAnim);
  scene = {parts:[], tovDisplay:0, t:0, last:performance.now(), spawnAcc:0, prodAcc:0};
  const loop = now=>{
    const c=$("#cvScene"); if(!c){return;}
    const dt=Math.min(50, now-scene.last)/1000; scene.last=now; scene.t+=dt;
    const ctx=c.getContext("2d"); const W=c.width,H=c.height;
    const {S} = state.sim; const {VmaxA} = computeApparent(); const v=vAt(S);
    // background
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#080f1b"; ctx.fillRect(0,0,W,H);
    // enzyme body
    const ex=W/2, ey=H/2;
    ctx.fillStyle="#132a3a"; ctx.strokeStyle="#1f8288"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(ex-52,ey-46,104,92,16); ctx.fill(); ctx.stroke();
    // active site notch
    ctx.fillStyle="#0a1a26"; ctx.beginPath(); ctx.arc(ex-52,ey,15,-Math.PI/2,Math.PI/2); ctx.fill();
    ctx.fillStyle="#45d3d8"; ctx.font="10px ui-monospace,monospace"; ctx.textAlign="center"; ctx.fillText("효소 E", ex, ey+3);
    // spawn substrate based on [S]
    const targetSub = Math.round(2 + 22*(S/S_MAX));
    const subs = scene.parts.filter(p=>p.type==="S");
    scene.spawnAcc += dt* (2 + S/12);
    while(scene.spawnAcc>1 && subs.length + scene.parts.filter(p=>p.type==="S"&&p.new).length < targetSub){
      scene.spawnAcc-=1;
      scene.parts.push({type:"S", x:Math.random()*(ex-120)+10, y:Math.random()*(H-30)+15, vx:20+Math.random()*20, vy:(Math.random()-.5)*14});
    }
    // spawn product at rate ∝ v (turnover)
    scene.prodAcc += dt* v*1.1;
    while(scene.prodAcc>1){ scene.prodAcc-=1; scene.tovDisplay++;
      scene.parts.push({type:"P", x:ex+50, y:ey+(Math.random()-.5)*30, vx:40+Math.random()*30, vy:(Math.random()-.5)*20, life:1});
      // consume a nearby substrate
      const si=scene.parts.findIndex(p=>p.type==="S"&&p.x>ex-90);
      if(si>=0) scene.parts.splice(si,1);
    }
    // update + draw
    scene.parts.forEach(p=>{
      if(p.type==="S"){ p.x+=p.vx*dt; p.y+=p.vy*dt;
        if(p.x>ex-70){ // bounce around active site region
          if(p.y<15||p.y>H-15) p.vy*=-1; }
        if(p.x>ex-64 && p.x<ex+64) p.x=ex-64; // stall at enzyme
        ctx.fillStyle="#33d17f"; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill();
      } else { p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*0.5;
        ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle="#f2c14e"; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill(); ctx.globalAlpha=1;
      }
    });
    scene.parts = scene.parts.filter(p=> !(p.type==="P"&&(p.life<=0||p.x>W)) && !(p.type==="S"&&p.x>W));
    // rate gauge
    const gw=W-40, gx0=20, gy0=H-14;
    ctx.fillStyle="#0d1a26"; ctx.beginPath(); ctx.roundRect(gx0,gy0-8,gw,10,5); ctx.fill();
    const frac=Math.min(v/VmaxA,1);
    ctx.fillStyle="#45d3d8"; ctx.beginPath(); ctx.roundRect(gx0,gy0-8,gw*frac,10,5); ctx.fill();
    // legend
    ctx.textAlign="left"; ctx.font="10px ui-monospace,monospace";
    ctx.fillStyle="#33d17f"; ctx.fillText("● 기질 S", 12, 16);
    ctx.fillStyle="#f2c14e"; ctx.fillText("● 생성물 P", 82, 16);
    const cap=$("#capTov"); if(cap) cap.textContent="회전수 "+scene.tovDisplay;
    simAnim=requestAnimationFrame(loop);
  };
  simAnim=requestAnimationFrame(loop);
}

window.runSweep = ()=>{
  if(simSweep){ clearInterval(simSweep); simSweep=null; $("#btnRun").textContent="▶ 반응 시작"; return; }
  $("#btnRun").textContent="⏸ 정지";
  state.sim.S=0; let t=0;
  const sS=$("#sS");
  simSweep=setInterval(()=>{
    t+=0.02; state.sim.S=Math.round(S_MAX*Math.min(t,1));
    if(sS) sS.value=state.sim.S; simUpdate();
    if(t>=1){ clearInterval(simSweep); simSweep=null; if($("#btnRun"))$("#btnRun").textContent="▶ 반응 시작"; save(); }
  },30);
};
window.resetSim = ()=>{ if(simSweep){clearInterval(simSweep);simSweep=null;}
  state.sim={Vmax:6,Km:12,S:12,inh:"none",istr:0}; save(); rSim(); };
window.jumpKm = ()=>{ const {KmA}=computeApparent(); state.sim.S=Math.round(KmA);
  const sS=$("#sS"); if(sS)sS.value=state.sim.S; save(); simUpdate(); toast("[S] = Km 으로 이동 — 이때 v = Vmax/2 입니다."); };
window.demoInhibitor = ()=>{ const order=["none","comp","noncomp"]; const i=(order.indexOf(state.sim.inh)+1)%3;

  save(); simUpdate(); toast({none:"억제제 없음",comp:"경쟁적 억제제 — 겉보기 Km 증가, Vmax 불변",noncomp:"비경쟁적 억제제 — Vmax 감소, Km 불변"}[state.sim.inh]); };

/* ---------- STEP 5 & 6: CHECK / QUIZ ---------- */
function renderMCQ(bank, store, opts){
  return bank.map((it,qi)=>{
    const sel = store[qi];
    const answered = sel!==undefined;
    const optsHtml = it.opts.map((o,oi)=>{
      let cls="";
      if(opts.reveal && answered){
        if(oi===it.a) cls=" correct";
        else if(oi===sel) cls=" wrong";
      } else if(sel===oi) cls=" sel";
      return `<button class="opt${cls}" onclick="pickMCQ('${opts.key}',${qi},${oi})">
        <span class="k">${"ABCD"[oi]}</span><span>${o}</span></button>`;
    }).join("");
    const expl = (opts.reveal && answered) ? `<div class="expl">${sel===it.a?"✅ 정답! ":"💡 "}${it.e}</div>` : "";
    return `<div class="qcard"><div class="qh"><span class="qn">Q${qi+1}</span>${it.q}</div>${optsHtml}${expl}</div>`;
  }).join("");
}
window.pickMCQ = (key,q,o)=>{
  const store = key==="check"?state.check:state.quiz;
  store[q]=o; save();
  key==="check"?rCheck():rQuiz();
};
function score(bank, store){ let s=0; bank.forEach((it,i)=>{ if(store[i]===it.a)s++; }); return s; }

function rCheck(){
  const answered = Object.keys(state.check).length;
  const graded = answered===CHECK.length;
  main.innerHTML = `<div class="panel">
    <div class="eyebrow">STEP 05 · 유도 확인 CHECK</div>
    <h1 class="h">유도 과정 확인 문제</h1>
    <p class="sub">방금 유도한 미카엘리스-멘텐 식의 각 단계를 이해했는지 확인합니다. 답을 고르면 즉시 채점·해설이 표시됩니다.</p>
    ${renderMCQ(CHECK, state.check, {key:"check", reveal:true})}
    <p class="note" style="margin-top:6px">점수: <b style="color:var(--amber)">${score(CHECK,state.check)} / ${CHECK.length}</b></p>
    ${footer(null,"다음 → 형성평가", graded, graded?null:"모든 문항에 답하면 다음으로 진행할 수 있습니다.")}</div>`;
}
function rQuiz(){
  const answered = Object.keys(state.quiz).length;
  const graded = answered===QUIZ.length;
  main.innerHTML = `<div class="panel">
    <div class="eyebrow">STEP 06 · 형성평가 FORMATIVE</div>
    <h1 class="h">형성평가</h1>
    <p class="sub">포화 반응, 효소 농도, 억제제, 회전수까지 전체 개념을 점검합니다.</p>
    ${renderMCQ(QUIZ, state.quiz, {key:"quiz", reveal:true})}
    <p class="note" style="margin-top:6px">점수: <b style="color:var(--amber)">${score(QUIZ,state.quiz)} / ${QUIZ.length}</b></p>
    ${footer(null,"다음 → 서술형", graded, graded?null:"모든 문항에 답하면 다음으로 진행할 수 있습니다.")}</div>`;
}

/* ---------- STEP 7: 서술형 · 자가 점검 (모두 로컬, 네트워크 없음) ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function essayLen(k){ return String(state.essay[k]||"").replace(/\s+/g," ").trim().length; }
function rv(k){ if(!isObj(state.review[k])) state.review[k] = {}; return state.review[k]; }
function fmtTime(iso){ const d=new Date(iso); return isNaN(d) ? "" : d.toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
const exOpen = {};   // 화면에서 예시 답안을 펼쳐 둔 상태(저장하지 않음)

function rEssay(){
  const essays = ESSAY.map((it,i)=>{
    const val = state.essay[it.k]||"";
    return `<div class="qcard essay">
      <div class="qh"><span class="qn">서술 ${i+1}</span>${it.q}</div>
      <textarea id="ess_${it.k}" placeholder="여기에 자기 말로 설명해 보세요..." oninput="onEssay('${it.k}')">${esc(val)}</textarea>
      <div class="essay-foot">
        <div class="tools">
          <button class="btn btn-sm btn-check" id="scb_${it.k}" onclick="selfCheck('${it.k}')">✓ 자가 점검</button>
          <button class="btn btn-sm btn-ghost" id="exb_${it.k}" onclick="toggleExemplar('${it.k}')">예시 답안 보기</button>
          ${CONFIG.showPromptCopy ? `<button class="btn btn-sm btn-ghost" id="pcb_${it.k}" onclick="copyEssayPrompt('${it.k}')">AI 도우미용 프롬프트 복사</button>` : ""}
        </div>
        <span class="cc" id="cc_${it.k}">${val.length} 자</span>
      </div>
      <div class="gate" id="exg_${it.k}"></div>
      <div class="sc-out hidden" id="sc_${it.k}"></div>
      <div class="ex-out hidden" id="ex_${it.k}"></div>
      <div class="pc-out hidden" id="pc_${it.k}"></div>
    </div>`;
  }).join("");
  main.innerHTML = `<div class="panel">
    <div class="eyebrow">STEP 07 · 서술형 · 자가 점검</div>
    <h1 class="h">서술형 문항 &amp; 자가 점검</h1>
    <p class="sub">자기 말로 설명한 뒤 <b>자가 점검</b>으로 빠진 개념이 없는지 확인하고 스스로 다듬어 보세요.
      예시 답안은 먼저 <b>${MIN_EXEMPLAR_LEN}자 이상</b> 써 본 뒤에 열 수 있으며, 열람 여부는 보고서에 함께 기록됩니다.</p>
    <div class="call"><div class="ct">자가 점검 안내</div>
      <p>키워드 기반 자동 점검 — 참고용이며 최종 평가는 선생님이 합니다. 이 브라우저 안에서만 동작하고 답안을 어디에도 보내지 않습니다.</p></div>
    ${essays}
    ${footer(null,"다음 → 최종 보고서")}</div>`;
  ESSAY.forEach(it=>{
    updateGate(it.k);
    if(rv(it.k).checks) renderCheck(it.k, runRubric(it.k, state.essay[it.k]));   // 이전에 점검했다면 결과를 다시 보여 줌
    if(exOpen[it.k] && rv(it.k).exemplarViewed) renderExemplar(it.k);
  });
}
window.onEssay = k=>{
  const t=$("#ess_"+k); state.essay[k]=t.value; $("#cc_"+k).textContent=t.value.length+" 자"; save();
  updateGate(k);
  const st=$("#scs_"+k); if(st) st.classList.remove("hidden");
};
function updateGate(k){
  const btn=$("#exb_"+k), g=$("#exg_"+k); if(!btn||!g) return;
  const r=rv(k), n=essayLen(k), seen=!!r.exemplarViewed;
  btn.disabled = !seen && n<MIN_EXEMPLAR_LEN;
  btn.textContent = seen ? (exOpen[k] ? "예시 답안 숨기기" : "예시 답안 다시 보기") : "예시 답안 보기";
  g.className = "gate" + (seen ? " seen" : "");
  g.textContent = seen ? `예시 답안 열람 기록: ${fmtTime(r.exemplarViewedAt)} (열람 당시 ${r.exemplarLenAtView!=null?r.exemplarLenAtView:"?"}자) — 보고서에 함께 표시됩니다.`
    : n<MIN_EXEMPLAR_LEN ? `예시 답안은 먼저 ${MIN_EXEMPLAR_LEN}자 이상 스스로 쓴 뒤에 열 수 있어요 (지금 ${n}자). 열람 여부는 보고서에 기록됩니다.`
    : "이제 예시 답안을 열 수 있어요. 열람 여부와 시각은 보고서에 기록됩니다.";
}
window.selfCheck = k=>{
  if(essayLen(k)<10){ toast("먼저 답안을 조금 더 작성해 주세요.",true); return; }
  const r=rv(k); r.checks=(r.checks||0)+1; r.lastCheckAt=new Date().toISOString(); save();
  renderCheck(k, runRubric(k, state.essay[k]));
};
function renderCheck(k, res){
  const box=$("#sc_"+k); if(!box) return;
  box.classList.remove("hidden");
  box.innerHTML = `<div class="sc-head"><span>자가 점검 · 키워드 기반</span><span class="sc-score">${res.met} / ${res.total} 항목 발견</span></div>
    <div class="sc-note">키워드 기반 자동 점검 — 참고용이며 최종 평가는 선생님이 합니다. ✓는 관련 표현이 보인다는 뜻일 뿐, 내용이 맞는지까지 확인한 것은 아닙니다.</div>
    <ul class="sc-list">${res.items.map(it=>`<li class="${it.ok?"ok":"miss"}"><span class="mk" aria-label="${it.ok?"발견":"보완 필요"}">${it.ok?"✓":"△"}</span>
      <div><div class="sl">${esc(it.label)}</div>${it.ok?"":`<div class="sh">💡 ${esc(it.hint)}</div>`}</div></li>`).join("")}</ul>
    <div class="sc-stale hidden" id="scs_${k}">✎ 답안이 바뀌었어요. 다시 점검하려면 '자가 점검'을 누르세요.</div>`;
}
window.toggleExemplar = k=>{
  const r=rv(k);
  if(!r.exemplarViewed){
    const n=essayLen(k);
    if(n<MIN_EXEMPLAR_LEN){ toast(`예시 답안은 ${MIN_EXEMPLAR_LEN}자 이상 쓴 뒤에 열 수 있어요 (지금 ${n}자).`,true); return; }
    if(!confirm("예시 답안을 열면 열람 기록(시각)이 보고서에 남습니다. 지금 열까요?")) return;
    r.exemplarViewed=true; r.exemplarViewedAt=new Date().toISOString(); r.exemplarLenAtView=n; save();
    exOpen[k]=true;
  } else exOpen[k]=!exOpen[k];
  renderExemplar(k); updateGate(k);
};
function renderExemplar(k){
  const box=$("#ex_"+k); if(!box) return;
  if(!exOpen[k]){ box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  box.innerHTML = `<div class="ex-head"><span>예시 답안 (모범답안)</span><span>열람 기록됨</span></div>
    <div class="ex-body">${esc(EXEMPLAR[k])}</div>
    <div class="ex-note">그대로 옮겨 적기보다, 내 답안에서 빠졌거나 흐릿한 개념을 찾아 <b>내 말로</b> 고쳐 써 보세요. 고친 답안이 보고서에 제출됩니다.</div>`;
}

/* ---- (선택) AI 도우미용 프롬프트 복사: 클립보드 복사만 함 · 네트워크 호출 없음 · 키 필요 없음 ---- */
function buildEssayPrompt(k){
  const i = ESSAY.findIndex(e=>e.k===k);
  return [
    "당신은 고등학생의 과학 서술형 답안에 피드백을 주는 학습 도우미입니다.",
    "정답이나 모범답안 문장을 대신 써 주지 말고, 학생이 스스로 고칠 수 있도록 질문과 힌트로만 안내해 주세요.",
    "",
    "[단원] 효소 반응 속도 — 미카엘리스–멘텐 식 (v = Vmax·[S]/(Km+[S]))",
    "[문항] " + ESSAY[i].q,
    "",
    "[점검 기준]",
    ...ESSAY_RUBRIC[k].map((c,j)=>(j+1)+". "+c.label+" — "+c.hint),
    "",
    "[학생 답안]",
    (state.essay[k]||"").trim() || "(아직 작성하지 않음)",
    "",
    "[요청]",
    "1) 잘한 점 1~2가지",
    "2) 점검 기준 중 빠졌거나 부정확한 부분 — 정답을 알려 주지 말고 생각해 볼 질문으로",
    "3) 한 단계 더 생각해 볼 질문 1개",
    "한국어로, 격려하는 말투로 짧게 답해 주세요. 과학적으로 틀린 내용이 있으면 어느 부분인지 짚어 주세요."
  ].join("\n");
}
window.copyEssayPrompt = k=>copyPrompt(buildEssayPrompt(k), "pc_"+k);
async function copyPrompt(text, hostId){
  let ok=false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await Promise.race([navigator.clipboard.writeText(text), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),1500))]);
      ok=true;
    }
  }catch(e){ ok=false; }
  const host=document.getElementById(hostId);
  if(host) showPromptBox(host, text, ok);
  if(ok){ toast("프롬프트를 복사했습니다. 학교에서 허용한 AI 도구에 붙여 넣으세요."); return; }
  // 대체 경로: 텍스트 상자를 선택해 두고 복사를 시도합니다. 실패해도 학생이 직접 복사할 수 있습니다.
  const ta = host && host.querySelector("textarea");
  if(ta){
    try{ ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); }catch(e){}
    let copied=false; try{ copied = !!(document.execCommand && document.execCommand("copy")); }catch(e){ copied=false; }
    if(copied){ const h=host.querySelector(".pc-head span"); if(h) h.textContent="AI 도우미용 프롬프트 · 복사됨 ✓"; toast("프롬프트를 복사했습니다. 학교에서 허용한 AI 도구에 붙여 넣으세요."); return; }
  }
  toast("자동 복사가 막혀 있어요. 아래 상자의 글을 선택해 복사하세요(Ctrl+C · 길게 눌러 복사).", true);
}
function showPromptBox(host, text, copied){
  host.classList.remove("hidden");
  host.innerHTML = `<div class="pc-head"><span>AI 도우미용 프롬프트 · ${copied?"복사됨 ✓":"아래 글을 선택해 복사하세요"}</span></div>
    <textarea readonly aria-label="AI 도우미용 프롬프트">${esc(text)}</textarea>
    <div class="pc-note">이 버튼은 글을 클립보드에 복사만 합니다(인터넷 전송 없음 · 키 필요 없음). <b>학교에서 허용한 AI 도구</b>에만 붙여 넣고, 이름·학번 같은 개인정보는 넣지 마세요. AI의 답도 참고용입니다.</div>
    <button class="btn btn-sm btn-ghost" onclick="this.parentNode.classList.add('hidden')">닫기</button>`;
}

/* 보고서·제출용 요약: 최종 답안으로 다시 점검한 결과 + 학생의 점검 횟수 + 예시 답안 열람 기록 */
function essayReview(){
  const out={};
  ESSAY.forEach(it=>{
    const r=rv(it.k), res=runRubric(it.k, state.essay[it.k]);
    out[it.k] = {
      selfCheck:{ method:"keyword", met:res.met, total:res.total,
        found:res.items.filter(x=>x.ok).map(x=>x.id), missing:res.items.filter(x=>!x.ok).map(x=>x.id),
        checkCount:r.checks||0, lastCheckedAt:r.lastCheckAt||null },
      exemplarViewed: !!r.exemplarViewed,
      exemplarViewedAt: r.exemplarViewedAt||null,
      exemplarLenAtView: r.exemplarViewed ? (r.exemplarLenAtView!=null ? r.exemplarLenAtView : null) : null
    };
  });
  return out;
}

/* ---------- STEP 8: SUBMIT ---------- */
function ansLine(bank, store){
  return bank.map((it,i)=>{
    const sel=store[i];
    const ok = sel===it.a;
    const txt = sel===undefined ? `<span class="neu">(미응답)</span>`
      : `<span class="${ok?"ok":"no"}">${"ABCD"[sel]}. ${it.opts[sel]} ${ok?"✓":"✗"}</span>`;
    return `<div class="qline"><span class="qq">Q${i+1}. ${it.q}</span>
      <span class="ans"><span class="lab">내 답: </span>${txt}</span></div>`;
  }).join("");
}
function rSubmit(){
  const cScore=score(CHECK,state.check), qScore=score(QUIZ,state.quiz);
  const predictLines = PREDICT.map((it,i)=>{
    const sel=state.predict[i];
    return `<div class="qline"><span class="qq">P${i+1}. ${it.q}</span>
      <span class="ans"><span class="lab">내 예측: </span>${sel===undefined?"<span class='neu'>—</span>":("ABC"[sel]+". "+it.opts[sel])}</span></div>`;
  }).join("");
  const review = essayReview();
  const essayLines = ESSAY.map((it,i)=>{
    const raw = (state.essay[it.k]||"").trim();
    const shown = raw ? raw.replace(/&/g,"&amp;").replace(/</g,"&lt;") : "<span class='neu'>—</span>";
    const rvw = review[it.k], sc = rvw.selfCheck;
    const ex = rvw.exemplarViewed ? `<span style="color:var(--amber)">열람함</span> (${esc(fmtTime(rvw.exemplarViewedAt))}, 열람 당시 ${rvw.exemplarLenAtView!=null?rvw.exemplarLenAtView:"?"}자)` : "열람 안 함";
    return `<div class="qline"><span class="qq">서술 ${i+1}. ${it.q}</span>
      <span class="ans"><span class="lab">내 답안: </span>${shown}</span>
      <span class="ans" style="font-size:12.5px; color:var(--muted)"><span class="lab">자가 점검(키워드 기반·참고용): </span>${sc.met}/${sc.total} 항목 · 점검 ${sc.checkCount}회
        · <span class="lab">예시 답안: </span>${ex}</span></div>`;
  }).join("");
  const {KmA,VmaxA}=computeApparent();
  const mode=submitMode();
  const subDesc = mode==="googleForm" ? "확인 후 제출하면 구글 폼으로 전송되어 연결된 스프레드시트에 기록됩니다. 인쇄(PDF 저장)도 가능합니다."
    : mode==="endpoint" ? "확인 후 제출하면 설정된 주소로 전송됩니다. 인쇄(PDF 저장)도 가능합니다."
    : "확인 후 제출하면 보고서가 파일로 저장됩니다. 저장한 파일을 구글 클래스룸/이메일로 제출하세요. 인쇄(PDF 저장)도 가능합니다.";
  const submitLabel = mode==="download" ? "보고서 저장 →" : "제출하기 →";

  main.innerHTML = `<div class="panel">
    <div class="eyebrow">STEP 08 · 최종 보고서 REPORT</div>
    <h1 class="h">최종 보고서</h1>
    <p class="sub">${subDesc}</p>

    <div class="rsec"><div class="rt">학생 정보</div>
      <div class="idgrid">
        <div class="idcell"><div class="il">이름</div><input id="rName" value="${(state.student.name||"").replace(/"/g,'&quot;')}" oninput="onId()"></div>
        <div class="idcell"><div class="il">학번</div><input id="rId" value="${(state.student.id||"").replace(/"/g,'&quot;')}" oninput="onId()"></div>
        <div class="idcell"><div class="il">유도 확인</div><div class="big" style="color:var(--amber)">${cScore}/${CHECK.length}</div></div>
        <div class="idcell"><div class="il">형성평가</div><div class="big" style="color:var(--amber)">${qScore}/${QUIZ.length}</div></div>
      </div></div>

    <div class="rsec"><div class="rt">예측 (STEP 01)</div>${predictLines}</div>
    <div class="rsec"><div class="rt"><span>유도 확인</span><span class="score">${cScore}/${CHECK.length}</span></div>${ansLine(CHECK,state.check)}</div>
    <div class="rsec"><div class="rt"><span>형성평가</span><span class="score">${qScore}/${QUIZ.length}</span></div>${ansLine(QUIZ,state.quiz)}</div>
    <div class="rsec"><div class="rt">서술형 답안</div>${essayLines}
      <div class="note">자가 점검은 키워드 기반 자동 점검 — 참고용이며 최종 평가는 선생님이 합니다.</div></div>
    <div class="rsec"><div class="rt">시뮬레이터 최종 설정</div>
      <div class="qline">Vmax=${state.sim.Vmax} μM/s · Km=${state.sim.Km} mM · [S]=${state.sim.S} mM · 억제제=${{none:"없음",comp:"경쟁적",noncomp:"비경쟁적"}[state.sim.inh]}(×${(1+state.sim.istr).toFixed(1)})
      → 겉보기 Vmax=${VmaxA.toFixed(1)}, 겉보기 Km=${KmA.toFixed(1)}, v=${vAt(state.sim.S).toFixed(2)} μM/s</div></div>

    <div class="foot">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-prev" onclick="go(${cur-1})">← 이전</button>
        <button class="btn btn-prev" onclick="window.print()">🖨 인쇄 / PDF</button>
        <button class="btn btn-prev" onclick="downloadReport()">⭳ 다운로드</button>
      </div>
      <button class="btn btn-next" id="submitBtn" onclick="submitReport()">${submitLabel}</button>
    </div></div>`;
}
window.onId = ()=>{ state.student.name=$("#rName").value; state.student.id=$("#rId").value;
  localStorage.setItem(LS.student, JSON.stringify(state.student)); $("#whoName").textContent=state.student.name||"—"; save(); };

function buildPayload(){
  return {
    timestamp:new Date().toISOString(),
    topic:"michaelis-menten",
    name:state.student.name, studentId:state.student.id,
    predict:state.predict,
    check:state.check, checkScore:score(CHECK,state.check), checkMax:CHECK.length,
    quiz:state.quiz, quizScore:score(QUIZ,state.quiz), quizMax:QUIZ.length,
    essay:state.essay,
    // 서술형별 자가 점검(키워드 기반, 최종 답안 기준)과 예시 답안 열람 기록(exemplarViewed · exemplarViewedAt)
    essayReview:essayReview(),
    sim:state.sim
  };
}
function submitMode(){
  const s = CONFIG.submit||{}; const m = s.mode;
  if(m==="googleForm" && s.googleForm && s.googleForm.formId) return "googleForm";
  if(m==="endpoint" && s.endpoint) return "endpoint";
  return "download";
}
window.downloadReport = ()=>{
  const blob=new Blob([JSON.stringify(buildPayload(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`효소반응속도_보고서_${state.student.name||"학생"}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
function submitViaGoogleForm(payload){
  return new Promise((resolve)=>{
    const gf = CONFIG.submit.googleForm;
    let sink = document.getElementById("gform_sink");
    if(!sink){ sink=document.createElement("iframe"); sink.id="gform_sink"; sink.name="gform_sink"; sink.style.display="none"; document.body.appendChild(sink); }
    const form=document.createElement("form"); form.style.display="none";
    form.action="https://docs.google.com/forms/d/e/"+gf.formId+"/formResponse";
    form.method="POST"; form.target="gform_sink";
    const vals={ name:payload.name, studentId:payload.studentId,
      checkScore:payload.checkScore+"/"+payload.checkMax, quizScore:payload.quizScore+"/"+payload.quizMax,
      essay1:(payload.essay&&payload.essay.s1)||"", essay2:(payload.essay&&payload.essay.s2)||"",
      review:ESSAY.map((it,i)=>{ const r=(payload.essayReview||{})[it.k]; if(!r) return "";
        return "서술"+(i+1)+": 키워드 점검 "+r.selfCheck.met+"/"+r.selfCheck.total+" · 예시답안 "+(r.exemplarViewed?"열람("+r.exemplarViewedAt+")":"미열람"); }).join(" | "),
      payload:JSON.stringify(payload) };
    const map=gf.entries||{};
    Object.keys(map).forEach(k=>{ if(map[k]){ const inp=document.createElement("input"); inp.type="hidden";
      inp.name=map[k]; inp.value=(vals[k]!=null?vals[k]:""); form.appendChild(inp); } });
    let done=false; const finish=()=>{ if(done)return; done=true; resolve(); };
    sink.addEventListener("load", finish, {once:true});
    document.body.appendChild(form); form.submit();
    // 구글 폼은 CORS 로 응답을 읽을 수 없어, 전송 후 타임아웃으로 성공 처리합니다.
    setTimeout(finish, 2500);
    setTimeout(()=>{ try{form.remove();}catch(e){} }, 3200);
  });
}
window.submitReport = async ()=>{
  if(!state.student.name){ toast("이름을 입력해 주세요.",true); return; }
  const btn=$("#submitBtn"); const orig=btn.textContent; btn.disabled=true; btn.textContent="제출 중...";
  const payload=buildPayload(); const mode=submitMode();
  try{
    if(mode==="googleForm"){ await submitViaGoogleForm(payload); toast("제출되었습니다. 수고했어요!"); }
    else if(mode==="endpoint"){
      const r=await fetch(CONFIG.submit.endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(!r.ok) throw new Error("HTTP "+r.status);
      toast("제출되었습니다. 수고했어요!");
    } else {
      window.downloadReport(); toast("보고서를 파일로 저장했습니다. 이 파일을 제출하세요.");
    }
    state.done.submit=true; save(); renderNav();
  }catch(err){
    toast("제출 실패: "+(err.message||err),true);
  }finally{ btn.disabled=false; btn.textContent=orig; }
};

/* ---------- toast ---------- */
let toTimer=null;
function toast(msg, err){
  const t=$("#toast"); t.textContent=msg; t.className="toast show"+(err?" err":"");
  clearTimeout(toTimer); toTimer=setTimeout(()=>t.className="toast",3200);
}

function boot(){
  load();
  $("#whoName").textContent = state.student.name||"—";
  if(state.student.name){ $("#intro").classList.add("hidden"); }
  else {
    $("#inName").value=state.student.name||""; $("#inId").value=state.student.id||"";
  }
  $("#introGo").onclick=()=>{
    const n=$("#inName").value.trim(), id=$("#inId").value.trim();
    if(!n){ $("#inName").focus(); return; }
    state.student={name:n,id:id}; localStorage.setItem(LS.student,JSON.stringify(state.student)); save();
    $("#whoName").textContent=n; $("#intro").classList.add("hidden");
  };
  $("#inName") && $("#inName").addEventListener("keydown",e=>{ if(e.key==="Enter")$("#inId").focus(); });
  $("#inId") && $("#inId").addEventListener("keydown",e=>{ if(e.key==="Enter")$("#introGo").click(); });
  $("#btnReset").onclick=()=>{
    if(confirm("모든 답안과 진행 상황을 초기화할까요?")){
      localStorage.removeItem(LS.state); localStorage.removeItem(LS.student); location.reload();
    }
  };
  renderAll();
}
boot();
