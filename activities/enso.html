<!--
  엘니뇨·라니냐(ENSO) 탐구 워크북 — 통합과학2 Ⅴ-2 기후 변화와 지구 환경 · [10통과2-02-03]
  단일 파일 정적 웹앱(외부 라이브러리 없음). 진행 상황은 이 브라우저(localStorage)에만 저장됩니다.

  데이터:
   · NOAA CPC 해양 엘니뇨 지수(ONI) — 같은 사이트의 ../data/oni.json 을 먼저 읽고,
     실패하면 아래 내장 스냅샷(ONI_SNAPSHOT)을, 그것도 없으면 '파일 직접 불러오기'를 안내합니다.
     GitHub Pages 배포 워크플로가 빌드 시점에 NOAA에서 받아 두 곳을 채웁니다(scripts/fetch-oni.mjs).
   · 실시간 해수면 온도 — Open-Meteo Marine API(키 불필요)를 버튼을 눌렀을 때만 호출합니다.
  제출 방식은 CONFIG.submit 에서 선택합니다: "download"(기본) · "googleForm" · "endpoint"
-->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엘니뇨·라니냐 탐구 워크북</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1626'/%3E%3Cpath d='M4 19c4-5 8 5 12 0s8 5 12 0' fill='none' stroke='%2345d3d8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#070b14; --bg2:#0a1120; --panel:#0e1626; --panel2:#111d31;
    --line:#1d2b41; --line2:#26374f;
    --txt:#e6edf6; --muted:#7e8da0; --faint:#586479;
    --cyan:#45d3d8; --cyan2:#63e6ea; --cyandim:#1c5a5e;
    --green:#33d17f; --amber:#f2c14e; --violet:#a98bff; --red:#ff6b7d; --blue:#5aa9ff;
    --warm:#f0873e;
    --mono:ui-monospace,SFMono-Regular,Menlo,"Cascadia Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans); color:var(--txt);
    background:radial-gradient(1200px 700px at 78% -8%,#122036 0,transparent 55%),
               radial-gradient(900px 600px at 5% 0,#0d1a2c 0,transparent 50%),
               linear-gradient(180deg,#070b14,#060910 60%);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--cyan)}
  .mono{font-family:var(--mono)}
  .hidden{display:none !important}

  /* ---------- header ---------- */
  header.top{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 26px; border-bottom:1px solid var(--line);
    background:rgba(8,13,22,.72); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:20;
  }
  .brand{font-family:var(--mono); font-size:11.5px; letter-spacing:.2em; color:var(--faint); white-space:nowrap}
  .brand b{color:var(--cyan)}
  .title{font-size:18px; font-weight:700}
  .title span{color:var(--cyan)}
  .top-right{margin-left:auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .who{font-size:13px; color:var(--muted)}
  .who b{color:var(--txt)}
  .btn-exit{font-family:var(--mono); font-size:11px; letter-spacing:.12em; padding:7px 13px; text-decoration:none;
    border:1px solid var(--line2); border-radius:8px; background:transparent; color:var(--muted); cursor:pointer}
  .btn-exit:hover{color:var(--txt); border-color:var(--cyandim)}

  /* ---------- layout ---------- */
  .wrap{display:grid; grid-template-columns:250px minmax(0,1fr); gap:24px; max-width:1260px; margin:0 auto; padding:24px 22px 70px}
  @media(max-width:880px){
    .wrap{grid-template-columns:minmax(0,1fr); padding:16px 14px 60px}
    nav.steps{position:static !important; display:grid !important; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px !important}
    .step{padding:9px 6px !important; flex-direction:column; gap:5px !important; text-align:center !important}
    .step .lbl{display:none}
    .step .nm{font-size:11.5px !important; margin:0 !important}
    header.top{padding:12px 14px}
  }

  /* ---------- sidebar ---------- */
  nav.steps{position:sticky; top:78px; align-self:start; display:flex; flex-direction:column; gap:9px}
  .step{
    display:flex; align-items:center; gap:12px; text-align:left;
    padding:12px 14px; border:1px solid var(--line); border-radius:13px;
    background:linear-gradient(180deg,#0d1626,#0b1320); color:var(--muted); cursor:pointer; width:100%;
  }
  .step:hover{border-color:var(--line2)}
  .step .num{flex:0 0 26px; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line2);
    display:grid; place-items:center; font-family:var(--mono); font-size:12.5px; color:var(--muted)}
  .step .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--faint)}
  .step .nm{font-size:14px; font-weight:600; margin-top:2px; color:var(--muted)}
  .step.active{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyandim) inset, 0 8px 30px -18px var(--cyan)}
  .step.active .num{border-color:var(--cyan); color:var(--cyan)}
  .step.active .nm{color:var(--txt)}
  .step.done .num{background:var(--green); border-color:var(--green); color:#04240f}
  .step.done .nm{color:#bfeed4}

  /* ---------- panel ---------- */
  .panel{border:1px solid var(--line); border-radius:18px; padding:28px 30px 24px; min-width:0;
    background:linear-gradient(180deg,rgba(16,24,40,.9),rgba(9,15,26,.9)); box-shadow:0 30px 80px -50px #000}
  @media(max-width:560px){ .panel{padding:20px 16px 18px; border-radius:14px} }
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--cyan); margin-bottom:12px}
  h1.h{font-size:27px; margin:0 0 8px; letter-spacing:-.01em}
  @media(max-width:560px){ h1.h{font-size:22px} }
  h3.sh{font-size:15.5px; margin:26px 0 10px}
  .sub{color:var(--muted); font-size:15px; line-height:1.65; margin:0 0 22px; max-width:72ch}
  .foot{display:flex; align-items:center; justify-content:space-between; margin-top:26px; gap:14px; flex-wrap:wrap}
  .note{color:var(--faint); font-size:12.5px; line-height:1.55}
  .btn{font-size:14px; font-weight:600; padding:11px 20px; border-radius:11px; cursor:pointer; border:1px solid transparent; font-family:var(--sans)}
  .btn-prev{background:transparent; border-color:var(--line2); color:var(--muted)}
  .btn-prev:hover{color:var(--txt); border-color:var(--cyandim)}
  .btn-next{background:linear-gradient(180deg,#1a6f74,#12545a); border-color:#1f8288; color:#e7fdff; box-shadow:0 10px 30px -14px var(--cyan)}
  .btn-next:hover{filter:brightness(1.08)}
  .btn-next:disabled{opacity:.4; cursor:not-allowed; box-shadow:none}
  .btn-violet{background:linear-gradient(180deg,#5a44b0,#43338a); border-color:#6f57c9; color:#efeaff}
  .btn-sm{font-size:12.5px; padding:8px 13px; border-radius:9px}
  .kbd{font-family:var(--mono); font-size:.92em; background:#0c1728; border:1px solid var(--line2); border-radius:6px; padding:1px 6px; color:var(--cyan2)}

  /* ---------- MCQ ---------- */
  .qcard{border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; background:rgba(10,17,30,.6)}
  @media(max-width:560px){ .qcard{padding:14px 13px} }
  .qh{font-size:15.5px; font-weight:600; margin-bottom:14px; line-height:1.5}
  .qh .qn{color:var(--cyan); font-family:var(--mono); margin-right:8px}
  .opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:13px 15px; border:1px solid var(--line);
    border-radius:11px; margin-bottom:10px; background:linear-gradient(180deg,#0c1524,#0a1220); color:var(--txt); cursor:pointer; font-size:14.5px; font-family:var(--sans); line-height:1.45}
  .opt:last-child{margin-bottom:0}
  .opt:hover{border-color:var(--line2)}
  .opt .k{flex:0 0 26px; width:26px; height:26px; border-radius:7px; border:1px solid var(--line2);
    display:grid; place-items:center; font-family:var(--mono); font-size:12px; color:var(--muted)}
  .opt.sel{border-color:var(--cyan); background:linear-gradient(180deg,#0e2733,#0b1c27)}
  .opt.sel .k{background:var(--cyan); border-color:var(--cyan); color:#04222a}
  .opt.correct{border-color:var(--green); background:linear-gradient(180deg,#0d2419,#0a1c15)}
  .opt.correct .k{background:var(--green); border-color:var(--green); color:#04240f}
  .opt.wrong{border-color:var(--red); background:linear-gradient(180deg,#2a1216,#1c0e12)}
  .opt.wrong .k{background:var(--red); border-color:var(--red); color:#2a0006}
  .expl{font-size:13px; color:var(--muted); margin-top:10px; padding:10px 13px; border-left:2px solid var(--cyandim); background:rgba(69,211,216,.05); border-radius:0 8px 8px 0; line-height:1.6}

  textarea, .inp{width:100%; font-family:var(--sans); font-size:14px; line-height:1.6; padding:12px 14px; border-radius:11px;
    border:1px solid var(--line2); background:#0a1220; color:var(--txt)}
  textarea{min-height:96px; resize:vertical}
  textarea:focus, .inp:focus{outline:none; border-color:var(--cyandim)}
  .inp{padding:9px 12px}
  label.fl{display:block; font-size:12px; color:var(--faint); font-family:var(--mono); letter-spacing:.08em; margin:0 0 7px}

  /* ---------- accordion / callouts ---------- */
  .acc{border:1px solid var(--line); border-radius:12px; margin-bottom:11px; overflow:hidden; background:rgba(10,17,30,.5)}
  .acc-h{display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer}
  .acc-h .an{flex:0 0 26px; width:26px; height:26px; border-radius:50%; background:#0c1c2a; border:1px solid var(--cyandim);
    display:grid; place-items:center; font-family:var(--mono); font-size:12px; color:var(--cyan)}
  .acc-h .at{font-weight:600; font-size:15px}
  .acc-h .caret{margin-left:auto; color:var(--faint); transition:transform .18s}
  .acc.open .caret{transform:rotate(90deg)}
  .acc-b{padding:0 18px; max-height:0; overflow:hidden; transition:max-height .25s ease, padding .2s}
  .acc.open .acc-b{padding:2px 18px 16px; max-height:900px}
  .acc-b p{font-size:14px; line-height:1.72; color:#cdd8e6; margin:6px 0}
  .acc-b b{color:var(--txt)}
  .call{border-left:3px solid var(--violet); background:rgba(169,139,255,.06); border-radius:0 10px 10px 0; padding:13px 17px; margin-bottom:12px}
  .call.amber{border-color:var(--amber); background:rgba(242,193,78,.06)}
  .call.cyan{border-color:var(--cyan); background:rgba(69,211,216,.05)}
  .call .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--violet); margin-bottom:6px}
  .call.amber .ct{color:var(--amber)} .call.cyan .ct{color:var(--cyan)}
  .call p{margin:0; font-size:14px; line-height:1.68; color:#d3dce8}

  /* ---------- simulator ---------- */
  .sim{display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:18px}
  @media(max-width:980px){ .sim{grid-template-columns:minmax(0,1fr)} }
  .canvas-wrap{border:1px solid var(--line); border-radius:12px; background:#080f1b; padding:10px; position:relative; min-width:0}
  .canvas-cap{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--faint); margin-bottom:6px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap}
  canvas{width:100%; display:block; border-radius:8px; touch-action:none}
  .ctrl{border:1px solid var(--line); border-radius:12px; padding:15px; background:linear-gradient(180deg,#0e1626,#0b1220); min-width:0}
  .ctrl-row{display:flex; gap:8px; margin-bottom:13px; flex-wrap:wrap}
  .csmall{flex:1; font-family:var(--mono); font-size:11px; letter-spacing:.04em; padding:9px 6px; border-radius:9px; border:1px solid var(--line2); background:#0c1524; color:var(--muted); cursor:pointer; white-space:nowrap}
  .csmall:hover{color:var(--txt); border-color:var(--cyandim)}
  .csmall.on{background:#12545a; border-color:#1f8288; color:#dffbff}
  .csmall.p-el{border-color:#6a3a20} .csmall.p-el.on{background:#6a3a20; border-color:var(--warm); color:#ffe3cc}
  .csmall.p-la{border-color:#254a6e} .csmall.p-la.on{background:#1d3f66; border-color:var(--blue); color:#dcecff}
  .sld{margin-bottom:14px}
  .sld label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px}
  .sld label .v{font-family:var(--mono); color:var(--cyan2)}
  .sld input[type=range]{width:100%; accent-color:var(--cyan)}
  .sld .ticks{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9.5px; color:var(--faint); margin-top:3px}
  .verdict{border-radius:11px; padding:12px 14px; margin-bottom:12px; border:1px solid var(--line2); background:#0a1220}
  .verdict .vk{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:var(--faint)}
  .verdict .vv{font-size:19px; font-weight:700; margin-top:2px}
  .verdict.el{border-color:#6a3a20; background:rgba(240,135,62,.08)} .verdict.el .vv{color:#ffb27a}
  .verdict.la{border-color:#254a6e; background:rgba(90,169,255,.08)} .verdict.la .vv{color:#9cc9ff}
  .verdict.ne .vv{color:var(--cyan2)}
  .chk{font-size:12.5px; color:var(--muted); display:flex; align-items:flex-start; gap:8px; margin-top:8px; line-height:1.45}
  .chk .box{flex:0 0 16px; width:16px; height:16px; border-radius:5px; border:1px solid var(--line2); display:grid; place-items:center; font-size:11px; color:transparent; margin-top:1px}
  .chk.on .box{background:var(--green); border-color:var(--green); color:#04240f}
  .chk.on{color:#bfeed4}

  .readouts{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:14px}
  @media(max-width:720px){ .readouts{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .ro{border:1px solid var(--line); border-radius:11px; padding:11px 12px; background:rgba(10,17,30,.55); min-width:0}
  .ro .rk{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; color:var(--faint); margin-bottom:4px}
  .ro .rv{font-family:var(--mono); font-size:18px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ro .ru{font-size:11px; color:var(--muted); margin-left:3px}

  .impacts{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px}
  .imp{border:1px solid var(--line); border-radius:11px; padding:11px 13px; background:rgba(10,17,30,.5); font-size:13px; line-height:1.5}
  .imp .in{font-weight:700; font-size:13px; margin-bottom:3px}
  .imp .it{color:var(--muted)}
  .imp.el{border-color:#6a3a20} .imp.el .it{color:#ffcfa8}
  .imp.la{border-color:#254a6e} .imp.la .it{color:#bcdcff}

  /* ---------- data ---------- */
  .srcbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; border:1px solid var(--line); border-radius:12px; padding:11px 14px; background:rgba(10,17,30,.5); font-size:12.5px; color:var(--muted); margin-bottom:14px; line-height:1.55}
  .srcbar b{color:var(--txt)}
  .pill{font-family:var(--mono); font-size:11px; padding:2px 9px; border-radius:20px; border:1px solid var(--line2); white-space:nowrap}
  .pill.g{color:#bfeed4; border-color:#1e5f3c; background:rgba(51,209,127,.08)}
  .pill.a{color:#f7dfa0; border-color:#6a5320; background:rgba(242,193,78,.08)}
  .pill.r{color:#ffc2ca; border-color:#5a2530; background:rgba(255,107,125,.08)}
  .status{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:14px}
  @media(max-width:720px){ .status{grid-template-columns:minmax(0,1fr)} }
  .rangebar{display:flex; gap:6px; flex-wrap:wrap}
  .chart-read{font-size:12.5px; color:var(--muted); margin-top:8px; min-height:20px; font-family:var(--mono)}
  .task{border:1px solid var(--line); border-radius:13px; padding:15px 16px; margin-bottom:14px; background:rgba(10,17,30,.5)}
  .task .tt{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--amber); margin-bottom:8px}
  .evrow{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
  .evrow:first-of-type{border-top:none}
  @media(max-width:560px){ .evrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .evrow .res{grid-column:1 / -1} }
  .evrow .en{font-weight:600; font-size:14px}
  .res{font-size:12.5px; line-height:1.5}
  .res.ok{color:var(--green)} .res.no{color:var(--red)} .res.neu{color:var(--muted)}
  .live{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:12px 0}
  @media(max-width:720px){ .live{grid-template-columns:minmax(0,1fr)} }
  .radios{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 10px}

  /* ---------- GRASPS ---------- */
  .stage1{border:1px solid var(--line2); border-radius:12px; padding:14px 16px; background:linear-gradient(180deg,#0d1c2b,#0b1624); margin-bottom:18px}
  .stage1 .tag{font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--cyan); margin-bottom:8px}
  .stage1 li{font-size:13.5px; line-height:1.65; color:#cdd8e6; margin-bottom:4px}
  .stage1 ul{margin:0; padding-left:18px}
  .bundles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
  @media(max-width:1080px){ .bundles{grid-template-columns:minmax(0,1fr)} }
  .bundle{border:1px solid var(--line); border-radius:14px; padding:15px 16px; background:rgba(10,17,30,.55); cursor:pointer; display:flex; flex-direction:column; gap:9px; text-align:left; color:var(--txt); font-family:var(--sans)}
  .bundle:hover{border-color:var(--line2)}
  .bundle.sel{border-color:var(--amber); box-shadow:0 0 0 1px #6a5320 inset, 0 10px 34px -20px var(--amber)}
  .bundle .prox{font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--amber)}
  .bundle .logic{font-size:12.5px; color:#e6d9a6; line-height:1.55; border-left:2px solid #6a5320; padding-left:9px}
  .bundle .ras{border:1px solid var(--line); border-radius:10px; padding:9px 11px; background:#0a1220}
  .bundle .ras .rk{font-family:var(--mono); font-size:9.5px; color:var(--faint); letter-spacing:.1em}
  .bundle .ras .rv{font-size:13px; line-height:1.5; margin-bottom:6px}
  .bundle .ras .rv:last-child{margin-bottom:0}
  .bundle .gp .rk{font-family:var(--mono); font-size:9.5px; color:var(--faint); letter-spacing:.1em}
  .bundle .gp .rv{font-size:13px; line-height:1.5; color:#cdd8e6; margin-bottom:6px}
  .bundle .std li{font-size:12.5px; line-height:1.5; color:#cdd8e6; margin-bottom:4px}
  .bundle .std ul{margin:4px 0 0; padding-left:16px}
  .bundle .std .src{font-family:var(--mono); font-size:10px; color:var(--cyan)}
  .pick{font-family:var(--mono); font-size:11px; padding:6px 10px; border-radius:8px; border:1px solid var(--line2); color:var(--muted); align-self:flex-start}
  .bundle.sel .pick{background:var(--amber); color:#2a1d00; border-color:var(--amber)}

  /* ---------- AI ---------- */
  .keybox{border:1px solid var(--line2); border-radius:14px; padding:16px 18px; margin:16px 0; background:linear-gradient(180deg,#130f24,#0e0b1c)}
  .keybox .kh{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--violet); margin-bottom:10px}
  .keyrow{display:flex; gap:10px; flex-wrap:wrap}
  .keyrow input{flex:1; min-width:180px; font-family:var(--mono); font-size:13px; padding:10px 12px; border-radius:9px; border:1px solid var(--line2); background:#0b1220; color:var(--txt)}
  .keyrow input:focus{outline:none; border-color:var(--violet)}
  .key-note{font-size:12px; color:var(--muted); margin-top:9px; line-height:1.55}

<script>

/* ============================================================

const CONFIG = {

});
let state = DEFAULT_STATE();

function save(){ try{ localStorage.setItem(LS.state, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const st = JSON.parse(localStorage.getItem(LS.state)||"null");
    if(st && typeof st==="object"){
      const d = DEFAULT_STATE();
      Object.keys(d).forEach(k=>{
        if(st[k]===undefined) return;
        d[k] = (d[k] && typeof d[k]==="object" && !Array.isArray(d[k]) && st[k] && typeof st[k]==="object")
          ? Object.assign(d[k], st[k]) : st[k];
      });

    }
    const stu = JSON.parse(localStorage.getItem(LS.student)||"null");

/* ============================================================
   내용 데이터
   ============================================================ */
const PREDICT = [
  {q:"적도 태평양에서 동쪽→서쪽으로 부는 무역풍이 약해지면, 동태평양(페루 앞바다) 표층 수온은 어떻게 될까요?",
   opts:["높아진다","낮아진다","거의 변하지 않는다"]},
  {q:"엘니뇨가 발생하면 인도네시아의 강수량은 어떻게 될까요?",

  {q:"엘니뇨는 얼마나 자주 나타날까요?",
   opts:["매년 같은 시기에","2~7년 간격으로 불규칙하게","수십 년에 한 번"]},
];

const CONCEPT = [
  {t:"적도 태평양의 평상시 모습", b:`<p>적도 부근에서는 동쪽에서 서쪽으로 <b>무역풍</b>이 붑니다. 바람에 밀린 따뜻한 표층 해수가 서쪽(인도네시아 부근)에 쌓여 <b>따뜻한 해수 웅덩이(웜풀)</b>를 이루고, 서태평양 해수면은 동태평양보다 약 0.5 m 높아집니다.</p>
    <p>그래서 평상시에는 <b>서태평양이 따뜻하고, 동태평양은 상대적으로 차갑습니다.</b></p>`},
  {t:"용승과 수온약층", b:`<p><b>수온약층</b>은 따뜻한 표층과 차가운 심층 사이에서 수온이 깊이에 따라 급격히 낮아지는 층입니다. 표층 해수가 서쪽으로 밀려가므로 수온약층은 <b>서쪽에서 깊고 동쪽에서 얕게</b> 기울어 있습니다.</p>
    <p>동태평양에서는 빠져나간 표층 해수를 채우려고 차가운 심층수가 올라오는 <b>용승</b>이 일어납니다. 용승한 물에는 영양염이 풍부해 페루 앞바다는 좋은 어장이 됩니다.</p>`},
  {t:"워커 순환 — 바다와 대기의 연결", b:`<p>따뜻한 서태평양에서는 공기가 데워져 <b>상승</b>하고 구름과 비가 많습니다. 차가운 동태평양에서는 공기가 <b>하강</b>해 건조합니다. 지표 부근에서는 동→서(무역풍), 상층에서는 서→동으로 공기가 돌아가는 이 순환을 <b>워커 순환</b>이라고 합니다.</p>
    <p>무역풍이 강하면 해수 차이가 커지고, 해수 차이가 크면 다시 무역풍이 강해집니다. 바다와 대기가 서로를 밀고 당기는 <b>되먹임</b>입니다.</p>`},
  {t:"엘니뇨", b:`<p>무역풍이 <b>약해지면</b> 서쪽에 쌓였던 따뜻한 해수가 동쪽으로 퍼집니다. 동태평양의 수온약층이 깊어져 <b>용승이 약해지고</b>, 동태평양 표층 수온이 평년보다 높아집니다.</p>
    <p>따뜻한 바다를 따라 <b>상승 기류와 강수 중심도 중·동태평양으로 이동</b>합니다. 그 결과 인도네시아·호주 쪽은 건조해지고(가뭄·산불), 페루 쪽은 비가 늘어납니다(홍수). 이름은 크리스마스 무렵 페루 어민들이 '아기 예수(El Niño)'라고 부른 데서 왔습니다.</p>`},
  {t:"라니냐", b:`<p>반대로 무역풍이 <b>평상시보다 강해지면</b> 따뜻한 해수가 서쪽에 더 많이 쌓이고, 동태평양 용승이 강해져 표층 수온이 평년보다 <b>낮아집니다</b>. 수온약층의 기울기는 더 커지고, 서태평양의 강수는 더 많아집니다.</p>`},
  {t:"ENSO와 판정 기준 — ONI", b:`<p>엘니뇨·라니냐는 해양과 대기가 함께 움직이는 현상이라 <b>ENSO(엘니뇨–남방진동)</b>라고 부릅니다. 남방진동은 태평양 동·서의 기압이 시소처럼 반대로 변하는 대기 쪽 신호입니다.</p>
    <p><b>ONI(해양 엘니뇨 지수)</b>는 <span class="kbd">Niño3.4 해역(5°S~5°N, 170°W~120°W)</span>의 해수면 온도 편차를 <b>3개월 이동평균</b>한 값입니다. 미국 NOAA는 ONI가 <b>+0.5 ℃ 이상인 상태가 연속 5개 계절(겹치는 3개월 평균) 이상</b> 이어지면 엘니뇨, <b>−0.5 ℃ 이하</b>가 그만큼 이어지면 라니냐로 판정합니다. 우리나라 기상청도 감시 구역의 3개월 이동평균 편차 ±0.5 ℃가 5개월 이상 지속되는지를 기준으로 삼습니다.</p>`},
  {t:"지구온난화와 엘니뇨", b:`<p>성취기준은 온실효과 강화로 인한 <b>지구온난화의 메커니즘</b>과 함께 엘니뇨·사막화 같은 현상이 지구 환경과 인간 생활에 미치는 영향, 대처 방안을 다룹니다. 강한 엘니뇨 시기에는 적도 태평양이 넓게 따뜻해져 전 지구 평균 기온이 일시적으로 더 높아지는 경향이 있습니다.</p>
    <p>온난화가 엘니뇨의 <b>빈도와 강도</b>를 어떻게 바꾸는지는 아직 연구가 진행 중입니다. 과학적 결론과 불확실성을 구분해서 말하는 연습을 이 활동에서 함께 합니다.</p>`},
];

const QUIZ = [
  {q:"평상시 적도 동태평양의 표층 수온이 서태평양보다 낮은 주된 이유는?",

   e:"무역풍이 약해지면 따뜻한 해수가 동쪽으로 퍼지며 동태평양 수온약층이 깊어지고 용승이 약해집니다. 수온약층은 평평해지는 쪽으로 변하고, 강수 중심은 동쪽으로 이동합니다."},

   e:"ONI는 Niño3.4 해역 수온 편차의 3개월 이동평균입니다. +0.5 ℃ 이상이 연속 5개 계절 이어졌으므로 엘니뇨 기준을 충족합니다."},

   e:"워커 순환이 약해지고 강수 중심이 동쪽으로 이동하면서, 같은 엘니뇨가 지역에 따라 가뭄과 홍수라는 상반된 결과를 만듭니다."},

const $ = s=>document.querySelector(s);

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sgn(n,d){ if(n==null||isNaN(n)) return "—"; const v=Number(n).toFixed(d==null?1:d); return (n>0?"+":"")+v; }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const SEASONS = ["DJF","JFM","FMA","MAM","AMJ","MJJ","JJA","JAS","ASO","SON","OND","NDJ"];
function lonLabel(lon){ lon=((lon%360)+360)%360; if(Math.abs(lon-180)<0.5) return "180°"; return lon<180? Math.round(lon)+"°E" : Math.round(360-lon)+"°W"; }
function classify(a){ return a>=0.5-1e-9 ? "el" : (a<=-0.5+1e-9 ? "la" : "ne"); }
const CLS_NAME = {el:"엘니뇨", la:"라니냐", ne:"평상시(중립)"};

function fitCanvas(cv, cssH){
  const w = Math.max(200, cv.getBoundingClientRect().width || cv.parentNode.clientWidth || 600);
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = Math.round(w*dpr); cv.height = Math.round(cssH*dpr); cv.style.height = cssH+"px";
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h:cssH};
}

function renderNav(){
  const nav = $("#nav"); nav.innerHTML="";
  STEPS.forEach((s,i)=>{
    const b = document.createElement("button");
    b.className = "step" + (i===cur?" active":"") + (state.done[s.id]?" done":"");
    b.innerHTML = `<div class="num">${state.done[s.id]?"✓":(i+1)}</div>
      <div><div class="lbl">${String(i+1).padStart(2,"0")} · ${s.lbl}</div><div class="nm">${s.nm}</div></div>`;
    b.onclick = ()=>go(i);
    nav.appendChild(b);
  });
}
function footer(nextLabel, nextEnabled, note){
  const dis = nextEnabled===false ? "disabled":"";
  return `<div class="foot">
    <div>${note?`<div class="note">${note}</div>`:""}</div>
    <div style="display:flex; gap:10px; flex-wrap:wrap">
      ${cur>0?`<button class="btn btn-prev" onclick="go(${cur-1})">← 이전</button>`:""}
      ${cur<STEPS.length-1?`<button class="btn btn-next" id="nextBtn" ${dis} onclick="advance()">${nextLabel||"다음 →"}</button>`:""}
    </div></div>`;
}
window.go = i=>{ cur=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
window.advance = ()=>{ state.done[STEPS[cur].id]=true; save(); if(cur<STEPS.length-1) cur++; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };

/* ---------- MCQ ---------- */
function renderMCQ(bank, store, key, reveal){
  return bank.map((it,qi)=>{
    const sel = store[qi]; const answered = sel!==undefined;
    const optsHtml = it.opts.map((o,oi)=>{
      let cls="";
      if(reveal && answered){ if(oi===it.a) cls=" correct"; else if(oi===sel) cls=" wrong"; }
      else if(sel===oi) cls=" sel";
      return `<button class="opt${cls}" onclick="pickMCQ('${key}',${qi},${oi})"><span class="k">${"ABCD"[oi]}</span><span>${o}</span></button>`;
    }).join("");
    const expl = (reveal && answered) ? `<div class="expl">${sel===it.a?"✅ 정답! ":"💡 "}${it.e}</div>` : "";
    return `<div class="qcard"><div class="qh"><span class="qn">Q${qi+1}</span>${it.q}</div>${optsHtml}${expl}</div>`;
  }).join("");
}
window.pickMCQ = (key,q,o)=>{
  if(key==="predict"){ state.predict[q]=o; save(); rPredict(); }
  else { state.quiz[q]=o; save(); rQuiz(); }
};
function score(bank, store){ let s=0; bank.forEach((it,i)=>{ if(store[i]===it.a)s++; }); return s; }

   STEP 3 · 시뮬레이터 (개념 모델 — 정량 예측용이 아님)
   w: 무역풍 세기(평상시 = 1.0)
   ============================================================ */
const W_MIN=0, W_MAX=1.75;
const PRESETS = { la:{w:1.6, nm:"라니냐"}, ne:{w:1.0, nm:"평상시"}, el:{w:0.35, nm:"엘니뇨"} };
function model(w){
  const west = 29.6 + 0.4*(w-1);           // 서태평양 웜풀(150°E) 표층 수온
  const nino = 27.0 - 2.1*(w-1);           // Niño3.4 해역 평균(중심 145°W)
  const far  = nino - 0.5 - 1.2*w;         // 동태평양 연안 쪽(90°W)
  const dW = clamp(80 + 70*w, 60, 210);    // 서쪽 수온약층 깊이(m)
  const dE = clamp(110 - 60*w, 15, 110);   // 동쪽 수온약층 깊이(m)
  const rainLon = w<1 ? 150 + 60*(1-w) : 150 - 28*(w-1);   // 강수(상승 기류) 중심 경도(°E, 0~360)
  const oni = nino - 27.0;                 // 시뮬레이터의 Niño3.4 편차(평상시 기준)
  return {w, west, nino, far, dW, dE, rainLon, oni, diff: west - nino, cls: classify(oni)};
}
function wFromDiff(diff){ return clamp(1 + (diff-2.6)/2.5, W_MIN, W_MAX); }   // 동–서 수온차 → 무역풍 세기(근사)
function sstAt(lon, m){
  const A = [[118,m.west+0.1],[150,m.west],[215,m.nino],[270,m.far],[284,m.far-0.2]];
  if(lon<=A[0][0]) return A[0][1];
  for(let i=0;i<A.length-1;i++){
    const [x0,y0]=A[i],[x1,y1]=A[i+1];
    if(lon<=x1){ const t=(lon-x0)/(x1-x0), s=(1-Math.cos(Math.PI*t))/2; return y0+(y1-y0)*s; }
  }
  return A[A.length-1][1];
}
function tcDepth(lon, m){ const t=clamp((lon-130)/(272-130),0,1); return m.dW+(m.dE-m.dW)*t; }
function upwellText(w){ return w>=1.25?"강함":w>=0.75?"보통":w>=0.35?"약함":"거의 없음"; }
const SST_STOPS=[[22,[31,78,140]],[24.5,[31,143,168]],[26.5,[63,191,159]],[27.5,[216,195,74]],[28.5,[240,154,62]],[29.5,[232,85,63]],[30.5,[184,38,74]]];
function sstColor(t){
  if(t<=SST_STOPS[0][0]) return `rgb(${SST_STOPS[0][1]})`;
  for(let i=0;i<SST_STOPS.length-1;i++){
    const [a,ca]=SST_STOPS[i],[b,cb]=SST_STOPS[i+1];
    if(t<=b){ const k=(t-a)/(b-a); return `rgb(${ca.map((v,j)=>Math.round(v+(cb[j]-v)*k)).join(",")})`; }
  }
  return `rgb(${SST_STOPS[SST_STOPS.length-1][1]})`;
}

let simAnim=null, simPlaying=true, simT=0, particles=[];
const reduceMotion = (()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();
function stopSim(){ if(simAnim){ cancelAnimationFrame(simAnim); simAnim=null; } }

function rSim(){
  const m = model(state.sim.w);
  const pv = state.predict[0];
  const pred = pv===undefined ? "" : `<div class="call amber"><div class="ct">내 예측 (P1)</div><p>무역풍이 약해지면 동태평양 표층 수온이 <b>${PREDICT[0].opts[pv]}</b>고 예측했습니다. 무역풍 슬라이더를 낮춰 확인해 보세요.</p></div>`;
  main.innerHTML = `<div class="panel">
    <div class="eyebrow">STEP 03 · 시뮬레이터 SIMULATOR</div>
    <h1 class="h">적도 태평양 단면 시뮬레이터</h1>
    <p class="sub">무역풍 세기를 바꾸며 따뜻한 해수의 위치, 수온약층의 기울기, 동태평양 용승, 대류·강수 위치가 어떻게 함께 움직이는지 관찰하세요. 이 시뮬레이터는 원리를 보여 주는 <b>개념 모델</b>이며, 수치는 실제 관측값이 아니라 경향을 나타냅니다.</p>
    ${pred}
    <div class="sim">
      <div class="canvas-wrap">
        <div class="canvas-cap"><span>적도(0°) 태평양 동서 단면 · 120°E → 80°W</span><span id="capState"></span></div>
        <canvas id="simCv" role="img" aria-label="적도 태평양 단면: 해수면 온도, 수온약층, 용승, 무역풍, 워커 순환, 강수 위치"></canvas>
      </div>
      <div class="ctrl">
        <div class="verdict" id="verdict"><div class="vk">시뮬레이터 상태 판정</div><div class="vv" id="verdictV">—</div></div>
        <div class="ctrl-row">
          <button class="csmall p-la" data-p="la" onclick="setPreset('la')">라니냐</button>
          <button class="csmall" data-p="ne" onclick="setPreset('ne')">평상시</button>
          <button class="csmall p-el" data-p="el" onclick="setPreset('el')">엘니뇨</button>
        </div>
        <div class="sld">
          <label for="wSl"><span>무역풍 세기 (평상시 = 100%)</span><span class="v" id="wV"></span></label>
          <input type="range" id="wSl" min="${W_MIN}" max="${W_MAX}" step="0.01" value="${state.sim.w}" oninput="setW(this.value)">
          <div class="ticks"><span>0%</span><span>100%</span><span>175%</span></div>
        </div>
        <div class="ctrl-row"><button class="csmall" id="playBtn" onclick="togglePlay()"></button></div>
        <div style="font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--faint); margin-top:4px">관찰 체크리스트</div>
        <div id="checks"></div>
      </div>
    </div>
    <div class="readouts" id="readouts"></div>
    <h3 class="sh">원격 영향 — 지금 상태에서 나타나기 쉬운 경향</h3>
    <p class="note" style="margin-top:-4px">통계적 경향입니다. 모든 엘니뇨·라니냐에서 똑같이 나타나지 않으며, 지역의 다른 요인과 함께 작용합니다.</p>
    <div class="impacts" id="impacts"></div>
    <div class="qcard" style="margin-top:18px">
      <div class="qh"><span class="qn">관찰</span>무역풍이 약해질 때 일어나는 변화를 순서대로(인과 사슬로) 적어 보세요.</div>
      <textarea id="simNote" placeholder="무역풍 약화 → ... → ... → ..." oninput="state.sim.note=this.value; save()">${esc(state.sim.note)}</textarea>
    </div>
    ${footer("다음 → 실제 데이터")}</div>`;
  if(!particles.length) particles = Array.from({length:70},()=>({lon:120+Math.random()*162, d:4+Math.random()*34, s:0.6+Math.random()*0.8}));
  simPlaying = !reduceMotion;
  updateSimUI();
  onResize = ()=>drawSim(false);
  if(simPlaying) loopSim(); else drawSim(false);
}
window.setW = v=>{ state.sim.w = clamp(parseFloat(v),W_MIN,W_MAX); updateSimUI(); if(!simPlaying) drawSim(false); };
window.setPreset = p=>{ state.sim.w = PRESETS[p].w; state.sim.presets[p]=true; const sl=$("#wSl"); if(sl) sl.value=state.sim.w; updateSimUI(); if(!simPlaying) drawSim(false); };
window.togglePlay = ()=>{ simPlaying=!simPlaying; updateSimUI(); if(simPlaying) loopSim(); else { stopSim(); drawSim(false); } };

function updateSimUI(){
  const m = model(state.sim.w), c = state.sim.check;
  if(state.sim.presets.ne || Math.abs(m.w-1)<0.05) c.normal = true;
  if(m.oni >= 0.5) c.elnino = true;
  if(m.oni <= -0.5) c.lanina = true;
  if(Math.abs(m.dW-m.dE) < 25) c.flat = true;
  if(m.rainLon > 180) c.dateline = true;
  save();
  $("#wV").textContent = Math.round(m.w*100)+"%";
  const vd=$("#verdict"); vd.className="verdict "+m.cls;
  $("#verdictV").textContent = CLS_NAME[m.cls]+"형 · 편차 "+sgn(m.oni)+" ℃";
  $("#capState").textContent = "무역풍 "+Math.round(m.w*100)+"%";
  document.querySelectorAll(".csmall[data-p]").forEach(b=>b.classList.toggle("on", Math.abs(PRESETS[b.dataset.p].w-m.w)<0.005));
  $("#playBtn").textContent = simPlaying ? "⏸ 애니메이션 멈춤" : "▶ 애니메이션 재생";
  const items = [["normal","평상시 상태를 관찰했다"],["elnino","엘니뇨 상태(편차 ≥ +0.5 ℃)를 만들었다"],["lanina","라니냐 상태(편차 ≤ −0.5 ℃)를 만들었다"],
                 ["flat","수온약층이 거의 평평해지는 무역풍 세기를 찾았다"],["dateline","강수 중심이 날짜변경선(180°) 동쪽으로 옮겨 가는 것을 보았다"]];
  $("#checks").innerHTML = items.map(([k,t])=>`<div class="chk${c[k]?" on":""}"><span class="box">✓</span><span>${t}</span></div>`).join("");
  const ro = [
    ["무역풍 세기", Math.round(m.w*100), "%"],
    ["서태평양 수온 (150°E)", m.west.toFixed(1), "℃"],
    ["Niño3.4 수온", m.nino.toFixed(1), "℃"],
    ["Niño3.4 편차", sgn(m.oni), "℃"],
    ["동–서 수온차", m.diff.toFixed(1), "℃"],
    ["수온약층 서 / 동", Math.round(m.dW)+" / "+Math.round(m.dE), "m"],
    ["동태평양 용승", upwellText(m.w), ""],
    ["강수 중심", lonLabel(m.rainLon), ""],
  ];
  $("#readouts").innerHTML = ro.map(([k,v,u])=>`<div class="ro"><div class="rk">${k}</div><div class="rv">${v}<span class="ru">${u}</span></div></div>`).join("");
  $("#impacts").innerHTML = REGIONS.map(r=>{
    const txt = m.cls==="el" ? r.el : m.cls==="la" ? r.la : "뚜렷한 ENSO 신호 없음 — 다른 요인이 더 크게 작용";
    return `<div class="imp ${m.cls}"><div class="in">${r.name}</div><div class="it">${txt}</div></div>`;
  }).join("");
}

function loopSim(){ stopSim(); const step=()=>{ drawSim(true); simAnim=requestAnimationFrame(step); }; simAnim=requestAnimationFrame(step); }

function drawSim(advance){
  const cv = $("#simCv"); if(!cv) return;
  const W0 = cv.getBoundingClientRect().width || 600;
  const H = clamp(Math.round(W0*0.54), 250, 440);
  if(cv._w!==Math.round(W0) || cv._h!==H){ fitCanvas(cv, H); cv._w=Math.round(W0); cv._h=H; }
  const ctx = cv.getContext("2d"), W = W0;
  const m = model(state.sim.w);
  if(advance) simT += 1;
  const padL=36, padR=10, seaY=Math.round(H*0.46), botY=H-22;
  // 배경 상자가 있는 라벨(선과 겹쳐도 읽히게)
  function tag(text, x, y, color, align, bold){
    ctx.font=(bold?"bold ":"")+"10.5px system-ui,sans-serif";
    const tw=ctx.measureText(text).width, x0 = align==="right" ? x-tw : align==="center" ? x-tw/2 : x;
    const bx=clamp(x0-4, 1, W-tw-9);
    ctx.fillStyle="rgba(8,15,27,.82)"; ctx.fillRect(bx, y-11, tw+8, 15);
    ctx.fillStyle=color; ctx.fillText(text, bx+4, y);
  }
  const X = lon=>padL+(lon-118)/(284-118)*(W-padL-padR);
  const Lon = x=>118+(x-padL)/(W-padL-padR)*(284-118);
  const D = d=>seaY+d/250*(botY-seaY);

  // 하늘
  const sky=ctx.createLinearGradient(0,0,0,seaY); sky.addColorStop(0,"#070d18"); sky.addColorStop(1,"#0e1a2d");
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,seaY);
  // 바다: 표층(수온 색) + 수온약층 아래 심층
  const deep=ctx.createLinearGradient(0,seaY,0,botY); deep.addColorStop(0,"#0d2f55"); deep.addColorStop(1,"#061426");
  ctx.fillStyle=deep; ctx.fillRect(padL,seaY,W-padL-padR,botY-seaY);
  for(let x=padL; x<W-padR; x+=2){
    const lon=Lon(x), y=D(tcDepth(lon,m));
    ctx.fillStyle=sstColor(sstAt(lon,m)); ctx.fillRect(x,seaY,2.2,y-seaY);
    const g=ctx.createLinearGradient(0,y-6,0,y+10); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(6,20,38,.9)");
    ctx.fillStyle=g; ctx.fillRect(x,y-6,2.2,16);
  }
  // 수온약층 선
  ctx.save(); ctx.strokeStyle="rgba(242,193,78,.9)"; ctx.lineWidth=1.6; ctx.setLineDash([6,4]); ctx.beginPath();
  for(let x=padL; x<=W-padR; x+=4){ const y=D(tcDepth(Lon(x),m)); x===padL?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.stroke(); ctx.restore();
  const labels=[];   // [text, x, y, color, align, bold] — 마지막에 한꺼번에 그림
  labels.push(["수온약층", X(163), D(tcDepth(163,m))+16, "#f7dfa0"]);
  labels.push(["따뜻한 표층 해수", X(131), seaY+16, "#e6edf6"]);
  labels.push(["차가운 심층수", X(214), botY-8, "#a9c3e3"]);

  // 표층 해류 입자(무역풍 방향으로 이동)
  const v = (m.w-0.18)*0.35;
  ctx.fillStyle="rgba(255,255,255,.55)";
  particles.forEach(p=>{
    if(advance){ p.lon -= v*p.s; if(p.lon<119) p.lon=283; if(p.lon>283) p.lon=119; }
    const lim = Math.min(p.d, tcDepth(p.lon,m)-4); if(lim<2) return;
    ctx.fillRect(X(p.lon), D(lim), 2, 2);
  });
  // 용승 화살표(동태평양)
  if(m.w>=0.3){
    ctx.save(); ctx.strokeStyle=`rgba(99,230,234,${clamp(0.25+0.5*(m.w-0.3),0.25,0.95)})`; ctx.lineWidth=1.8;
    ctx.setLineDash([5,5]); ctx.lineDashOffset = -simT*0.6*m.w;
    [246,258,270].forEach(lon=>{
      const x=X(lon), y0=D(Math.min(235,tcDepth(lon,m)+60)), y1=seaY+8;
      ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();
      ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(x-4,y1+6); ctx.lineTo(x,y1); ctx.lineTo(x+4,y1+6); ctx.stroke(); ctx.setLineDash([5,5]);
    });
    ctx.restore();
    labels.push(["용승 "+upwellText(m.w), X(258), D(Math.min(232,tcDepth(250,m)+72)), "#63e6ea", "center"]);
  }
  // Niño3.4 해역 표시(해수면 바로 아래 괄호)
  ctx.save(); ctx.strokeStyle="rgba(169,139,255,.95)"; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(X(190),seaY+7); ctx.lineTo(X(190),seaY+1); ctx.lineTo(X(240),seaY+1); ctx.lineTo(X(240),seaY+7); ctx.stroke(); ctx.restore();
  labels.push(["Niño3.4 해역", X(215), seaY+19, "#cbb8ff", "center"]);

  // 육지
  ctx.fillStyle="#1f2a1c";
  ctx.beginPath(); ctx.moveTo(padL,seaY-16); ctx.lineTo(X(123),seaY-10); ctx.lineTo(X(126),seaY); ctx.lineTo(X(124),botY); ctx.lineTo(padL,botY); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W-padR,seaY-58); ctx.lineTo(X(280),seaY-30); ctx.lineTo(X(278),seaY); ctx.lineTo(X(281),botY); ctx.lineTo(W-padR,botY); ctx.closePath(); ctx.fill();
  labels.push(["인도네시아", padL+2, seaY-22, "#b5c9ae"]);
  labels.push(["남미(페루)", W-padR-2, seaY-66, "#b5c9ae", "right"]);

  // 무역풍 화살표(해수면 위)
  const wy=seaY-14;
  ctx.save(); ctx.strokeStyle="rgba(230,237,246,.85)"; ctx.fillStyle="rgba(230,237,246,.85)"; ctx.lineWidth=1.6;
  [150,185,220,255].forEach((lon,i)=>{
    const x=X(lon), ph=((simT*0.8+i*17)%30)/30;
    if(m.w>=0.15){
      const len=10+34*m.w, xs=x+len/2-ph*6, xe=xs-len;
      ctx.beginPath(); ctx.moveTo(xs,wy); ctx.lineTo(xe,wy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xe,wy); ctx.lineTo(xe+6,wy-4); ctx.lineTo(xe+6,wy+4); ctx.closePath(); ctx.fill();
    } else {
      const xs=x-8+ph*4, xe=xs+16;
      ctx.beginPath(); ctx.moveTo(xs,wy); ctx.lineTo(xe,wy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xe,wy); ctx.lineTo(xe-6,wy-4); ctx.lineTo(xe-6,wy+4); ctx.closePath(); ctx.fill();
    }
  });
  ctx.restore();
  labels.push([m.w>=0.15?"← 무역풍":"서풍 이상 →", X(203), wy+4, "#e6edf6", "center"]);

  // 워커 순환(주 순환: 강수 중심에서 상승 → 상층 동쪽 → 동태평양 하강 → 지표 서쪽)
  const topY=30, lowY=seaY-32;
  const sinkLon = m.rainLon<236 ? 262 : 274;
  const walkA = clamp(0.25+0.55*m.w,0.2,0.95);
  function loopPath(x0,x1,dir){
    ctx.beginPath();
    if(dir>0){ ctx.moveTo(x0,lowY); ctx.lineTo(x0,topY); ctx.lineTo(x1,topY); ctx.lineTo(x1,lowY); ctx.lineTo(x0,lowY); }
    else     { ctx.moveTo(x1,lowY); ctx.lineTo(x1,topY); ctx.lineTo(x0,topY); ctx.lineTo(x0,lowY); ctx.lineTo(x1,lowY); }
  }
  ctx.save(); ctx.lineWidth=clamp(1+2.2*m.w,1,4.4); ctx.strokeStyle=`rgba(169,139,255,${walkA})`;
  ctx.setLineDash([10,8]); ctx.lineDashOffset = -simT*(0.4+0.8*m.w);
  loopPath(X(m.rainLon), X(sinkLon), 1); ctx.stroke();
  if(m.w<0.75){  // 엘니뇨 때: 서쪽으로 갈라진 두 번째 순환(인도네시아 쪽 하강)
    ctx.strokeStyle=`rgba(169,139,255,${clamp((0.75-m.w)/0.75,0.15,0.8)})`; ctx.lineWidth=1.6;
    loopPath(X(134), X(m.rainLon), -1); ctx.stroke();
  }
  ctx.restore();
  labels.push(["워커 순환", X((m.rainLon+sinkLon)/2+8), topY+4, "#cbb8ff", "center"]);
  labels.push(["하강·건조", X(sinkLon), lowY-8, "#cbb8ff", "center"]);

  // 구름·강수(강수 중심)
  const rx=X(m.rainLon), inten=clamp((sstAt(m.rainLon,m)-26.5)/3,0.25,1.2);
  ctx.fillStyle="rgba(210,225,240,.92)";
  [[-16,52,15],[0,46,19],[17,53,14],[-6,59,13],[10,61,12]].forEach(([dx,dy,r])=>{ ctx.beginPath(); ctx.arc(rx+dx,dy,r,0,Math.PI*2); ctx.fill(); });
  ctx.strokeStyle="rgba(99,170,255,.85)"; ctx.lineWidth=1.2;
  const n=Math.round(10*inten);
  for(let i=0;i<n;i++){
    const dx=-22+(i*47/n), yy=70+((simT*3+i*23)%Math.max(20,(seaY-82)));
    ctx.beginPath(); ctx.moveTo(rx+dx,yy); ctx.lineTo(rx+dx-2,yy+8); ctx.stroke();
  }
  labels.push(["상승·강수 중심 "+lonLabel(m.rainLon), rx, 14, "#bfe0ff", "center"]);

  // 영향 꼬리표(육지 위) — 좁은 화면에서는 아래 '원격 영향' 카드로 대신함
  if(W<480){ for(let i=labels.length-1;i>=0;i--) if(labels[i][0]==="하강·건조") labels.splice(i,1); }
  else if(m.cls==="el"){ labels.push(["건조·가뭄·산불↑", padL+2, seaY-40, "#ffb27a", "left", true]); labels.push(["강수↑·홍수, 어획량↓", W-padR-2, seaY-84, "#ffb27a", "right", true]); }
  else if(m.cls==="la"){ labels.push(["강수↑·홍수 위험", padL+2, seaY-40, "#9cc9ff", "left", true]); labels.push(["건조·어장 풍부", W-padR-2, seaY-84, "#9cc9ff", "right", true]); }
  labels.forEach(l=>tag(l[0], l[1], l[2], l[3], l[4], l[5]));

  // 축
  ctx.fillStyle="#586479"; ctx.font="10px ui-monospace,monospace";
  [[120,"120°E"],[150,"150°E"],[180,"180°"],[210,"150°W"],[240,"120°W"],[270,"90°W"]].forEach(([lon,t])=>{ const x=X(lon); ctx.fillText(t, x-14, H-6); ctx.fillRect(x,botY,1,4); });
  [0,100,200].forEach(d=>{ ctx.fillText(d+"m", 2, D(d)+4); });
}

/* ============================================================
   ONI 데이터 — 불러오기 · 분석
   ============================================================ */
let ONI = { series:null, source:"", meta:null, state:"loading", error:"" };

function parseOniText(text){
  const out=[]; const re=/^\s*([A-Z]{3})\s+(\d{4})\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s*$/;
  String(text).split(/\r?\n/).forEach(line=>{ const mm=line.match(re); if(!mm) return; const s=SEASONS.indexOf(mm[1]); if(s<0) return; out.push([+mm[2], s, +mm[4]]); });
  return out;
}
function validSeries(arr){
  if(!Array.isArray(arr) || arr.length<120) return false;
  return arr.every(r=>Array.isArray(r) && r.length>=3 && r[0]>=1950 && r[0]<=2100 && r[1]>=0 && r[1]<12 && r[2]>-5 && r[2]<5);
}
function setONI(doc, source){
  if(!doc || !validSeries(doc.series)){ ONI={series:null, source:"", meta:null, state:"none", error:""}; return false; }
  const series = doc.series.map(([y,s,a])=>({y, s, a, t:y+s/12+1/24}));
  ONI = { series, source, meta:{fetchedAt:doc.fetchedAt||"", url:doc.url||ONI_URL, first:doc.first||"", last:doc.last||""}, state:"ok", error:"" };
  return true;
}
async function loadONI(){
  if(location.protocol!=="file:"){
    try{
      const r = await fetch("../data/oni.json", {cache:"no-cache"});
      if(r.ok){ const j = await r.json(); if(setONI(j, "data/oni.json (같은 사이트)")) return; }
    }catch(e){}
  }
  if(typeof ONI_SNAPSHOT!=="undefined" && ONI_SNAPSHOT && setONI(ONI_SNAPSHOT, "내장 스냅샷")) return;
  ONI = {series:null, source:"", meta:null, state:"none", error:""};
}
function episodes(series){
  const out=[]; let run=null;
  const flush=()=>{ if(run && run.n>=5) out.push(run); run=null; };
  series.forEach((p,i)=>{
    const k = classify(p.a);
    if(k!=="ne" && run && run.k===k){ run.n++; run.end=i; }
    else { flush(); run = k!=="ne" ? {k, start:i, end:i, n:1} : null; }
  });
  flush(); return out;
}
function currentStatus(series){
  const last = series[series.length-1]; const k = classify(last.a);
  let n=0; for(let i=series.length-1;i>=0 && classify(series[i].a)===k;i--) n++;
  return {last, k, n};
}
function eventPeak(series, y){
  const win = series.filter(p=>(p.y===y && p.s>=4) || (p.y===y+1 && p.s<=5));
  if(win.length<6) return null;
  let best=win[0]; win.forEach(p=>{ if(p.a>best.a) best=p; });
  return {a:best.a, label:SEASONS[best.s]+" "+best.y};
}
function seasonLabel(p){ return SEASONS[p.s]+" "+p.y; }

function eventRow(ev){
  const v = state.data.events[ev.id] && state.data.events[ev.id].v;
  return `<div class="evrow"><div class="en">${ev.label}</div>
    <input class="inp" type="number" step="0.1" min="-3" max="4" id="ev_${ev.id}" placeholder="최고 ONI" value="${v!=null?esc(v):""}" ${ONI.state==="ok"?"":"disabled"}>
    <button class="btn btn-prev btn-sm" onclick="checkEvent('${ev.id}')" ${ONI.state==="ok"?"":"disabled"}>확인</button>
    <div class="res neu" id="res_${ev.id}" style="grid-column:1 / -1"></div></div>`;
}
window.checkEvent = id=>{
  const ev = EVENTS.find(e=>e.id===id); const inp=$("#ev_"+id); const v=parseFloat(inp.value);
  if(isNaN(v)){ toast("값을 입력하세요.",true); return; }
  const pk = eventPeak(ONI.series, ev.y);
  state.data.events[id] = {v, ok: pk ? Math.abs(v-pk.a)<=0.1+1e-9 : null, peak: pk?pk.a:null, peakAt: pk?pk.label:null};
  save(); renderEventResults(); drawChart();
};
function renderEventResults(){
  EVENTS.forEach(ev=>{
    const el=$("#res_"+ev.id); if(!el) return; const r=state.data.events[ev.id];
    if(ONI.state!=="ok"){ el.className="res neu"; el.textContent="데이터를 불러오면 확인할 수 있습니다."; return; }
    const pk=eventPeak(ONI.series, ev.y);
    if(!pk){ el.className="res neu"; el.textContent="불러온 자료에 이 기간이 충분히 들어 있지 않습니다."; return; }
    if(!r){ el.className="res neu"; el.textContent=""; return; }
    el.className="res "+(r.ok?"ok":"no");
    el.textContent = r.ok ? `✓ 정확합니다. 최고점은 ${pk.label}의 ${sgn(pk.a)} ℃입니다.` : `✗ 다시 찾아보세요. 힌트: 이 사건의 최고점은 ${sgn(pk.a)}에서 0.1 이내가 아닙니다. 범위 버튼으로 확대해 보세요.`;
  });
  const sr=$("#strongRes"); if(!sr) return;
  if(ONI.state!=="ok" || !state.data.strongest){ sr.textContent=""; return; }
  const peaks = EVENTS.map(ev=>({ev, pk:eventPeak(ONI.series, ev.y)})).filter(x=>x.pk);
  if(!peaks.length){ sr.textContent=""; return; }
  const max = Math.max(...peaks.map(x=>x.pk.a));
  const chosen = peaks.find(x=>x.ev.id===state.data.strongest);
  const right = chosen && Math.abs(chosen.pk.a-max)<1e-9;
  sr.className="res "+(right?"ok":"no");
  sr.textContent = right ? "✓ 자료에 따르면 가장 높은 ONI를 기록한 사건입니다." : "✗ 세 사건의 최고점을 서로 비교해 보세요.";
}
window.pickStrongest = v=>{ state.data.strongest=v; save(); renderEventResults(); };
window.setRange = k=>{ chartRange=k; chartSel=null; rData(); };

function chartView(){
  const s = ONI.series; const tMax = s[s.length-1].t + 0.1;
  const tMin = chartRange==="10" ? tMax-10.1 : chartRange==="30" ? tMax-30.1 : s[0].t-0.3;
  return {tMin, tMax, pts: s.filter(p=>p.t>=tMin && p.t<=tMax)};
}
function drawChart(){
  const cv=$("#oniCv"); if(!cv) return;
  const W0 = cv.getBoundingClientRect().width || 600;
  const H = W0<520 ? 230 : 290;
  const {ctx, w:W} = fitCanvas(cv, H);
  ctx.fillStyle="#080f1b"; ctx.fillRect(0,0,W,H);
  const padL=34, padR=8, padT=10, padB=22;
  const Y = a=>padT+(3-a)/6*(H-padT-padB);
  ctx.font="10px ui-monospace,monospace";
  // 격자·기준선
  [-2,-1,0,1,2].forEach(a=>{ ctx.fillStyle="#1a2638"; ctx.fillRect(padL,Y(a),W-padL-padR,1); ctx.fillStyle="#586479"; ctx.fillText((a>0?"+":"")+a, 4, Y(a)+3); });
  if(ONI.state!=="ok"){ ctx.fillStyle="#586479"; ctx.font="13px system-ui,sans-serif"; ctx.fillText("실제 ONI 자료가 아직 없습니다", padL+12, H/2); return; }
  const {tMin,tMax,pts} = chartView();
  const X = t=>padL+(t-tMin)/(tMax-tMin)*(W-padL-padR);
  // 공식 에피소드 음영
  episodes(ONI.series).forEach(ep=>{
    const a=ONI.series[ep.start].t-1/24, b=ONI.series[ep.end].t+1/24; if(b<tMin||a>tMax) return;
    ctx.fillStyle = ep.k==="el" ? "rgba(240,135,62,.13)" : "rgba(90,169,255,.13)";
    ctx.fillRect(X(Math.max(a,tMin)), padT, X(Math.min(b,tMax))-X(Math.max(a,tMin)), H-padT-padB);
  });
  // ±0.5 기준선
  ctx.save(); ctx.setLineDash([5,4]);
  ctx.strokeStyle="rgba(240,135,62,.8)"; ctx.beginPath(); ctx.moveTo(padL,Y(0.5)); ctx.lineTo(W-padR,Y(0.5)); ctx.stroke();
  ctx.strokeStyle="rgba(90,169,255,.8)"; ctx.beginPath(); ctx.moveTo(padL,Y(-0.5)); ctx.lineTo(W-padR,Y(-0.5)); ctx.stroke();
  ctx.restore();
  ctx.fillStyle="#ffb27a"; ctx.fillText("+0.5 엘니뇨 기준", W-padR-96, Y(0.5)-4);
  ctx.fillStyle="#9cc9ff"; ctx.fillText("−0.5 라니냐 기준", W-padR-96, Y(-0.5)+12);
  // 면 채우기(양: 주황, 음: 파랑)
  if(pts.length>1){
    [["rgba(240,135,62,.55)",0,Y(0)],["rgba(90,169,255,.55)",Y(0),H]].forEach(([col,y0,y1])=>{
      ctx.save(); ctx.beginPath(); ctx.rect(padL,y0,W-padL-padR,y1-y0); ctx.clip();
      ctx.beginPath(); ctx.moveTo(X(pts[0].t),Y(0)); pts.forEach(p=>ctx.lineTo(X(p.t),Y(p.a))); ctx.lineTo(X(pts[pts.length-1].t),Y(0)); ctx.closePath();
      ctx.fillStyle=col; ctx.fill(); ctx.restore();
    });
    ctx.strokeStyle="#e6edf6"; ctx.lineWidth=1.1; ctx.beginPath();
    pts.forEach((p,i)=>i?ctx.lineTo(X(p.t),Y(p.a)):ctx.moveTo(X(p.t),Y(p.a))); ctx.stroke();
  }
  // x 눈금
  const span=tMax-tMin, stepY = span>40?10:span>15?5:span>6?2:1;
  ctx.fillStyle="#586479";
  for(let y=Math.ceil(tMin/stepY)*stepY; y<=tMax; y+=stepY){ const x=X(y); ctx.fillRect(x,H-padB,1,4); ctx.fillText(String(y), x-12, H-6); }
  // 확인된 사건 최고점 표시
  EVENTS.forEach(ev=>{
    const r=state.data.events[ev.id]; if(!r||!r.ok) return; const pk=eventPeak(ONI.series, ev.y); if(!pk) return;
    const p = ONI.series.find(q=>seasonLabel(q)===pk.label); if(!p||p.t<tMin||p.t>tMax) return;
    ctx.fillStyle="#f2c14e"; ctx.beginPath(); ctx.arc(X(p.t),Y(p.a),4,0,Math.PI*2); ctx.fill();
    ctx.fillText(ev.label.slice(0,7), X(p.t)-20, Y(p.a)-8);
  });
  // 선택점
  if(chartSel){ const x=X(chartSel.t), y=Y(chartSel.a);
    ctx.strokeStyle="rgba(99,230,234,.7)"; ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
    ctx.fillStyle="#63e6ea"; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); }
}
function bindChart(){
  const cv=$("#oniCv"); if(!cv || ONI.state!=="ok") return;
  const pick = ev=>{
    const r=cv.getBoundingClientRect(); const {tMin,tMax,pts}=chartView(); if(!pts.length) return;
    const t = tMin+(ev.clientX-r.left-34)/(r.width-34-8)*(tMax-tMin);
    let best=pts[0]; pts.forEach(p=>{ if(Math.abs(p.t-t)<Math.abs(best.t-t)) best=p; });
    chartSel=best; drawChart();
    const k=classify(best.a);
    $("#chartRead").textContent = `${seasonLabel(best)} · ONI ${sgn(best.a)} ℃ · ${k==="ne"?"기준 범위 안(중립)":CLS_NAME[k]+" 기준 쪽"}`;
  };
  cv.addEventListener("pointermove", pick);
  cv.addEventListener("pointerdown", pick);
}
window.loadOniFile = inp=>{
  const f = inp.files && inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let doc=null; const txt=String(rd.result||"");
    try{ const j=JSON.parse(txt); if(j && Array.isArray(j.series)) doc=j; }catch(e){}
    if(!doc){ const s=parseOniText(txt); doc={series:s, url:ONI_URL, fetchedAt:new Date(f.lastModified||Date.now()).toISOString()}; }
    if(setONI(doc, "직접 불러온 파일 ("+f.name+")")){ toast("ONI 자료를 불러왔습니다."); chartSel=null; rData(); }
    else toast("ONI 형식을 읽지 못했습니다. NOAA의 oni.ascii.txt 파일인지 확인하세요.", true);
  };
  rd.readAsText(f);
};

/* ---------- 실시간 해수면 온도 (Open-Meteo Marine) ---------- */
const LIVE_POINTS = [
  {k:"west", lat:0, lon:150,  name:"서태평양 웜풀 (0°, 150°E)"},
  {k:"east", lat:0, lon:-145, name:"Niño3.4 중심 (0°, 145°W)"},

async function fetchPointSST(p){
  const url = "https://marine-api.open-meteo.com/v1/marine?latitude="+p.lat+"&longitude="+p.lon+
              "&hourly=sea_surface_temperature&past_days=1&forecast_days=1&timezone=GMT";
  const r = await fetch(url); const j = await r.json().catch(()=>null);
  if(!r.ok || !j || j.error) throw new Error((j && j.reason) || ("HTTP "+r.status));
  const times=(j.hourly&&j.hourly.time)||[], vals=(j.hourly&&j.hourly.sea_surface_temperature)||[];
  const now=Date.now(); let best=null, first=null;
  for(let i=0;i<times.length;i++){
    const v=vals[i], t=Date.parse(times[i]+"Z"); if(v==null || isNaN(t)) continue;
    if(!first) first={t,v};
    if(t<=now) best={t,v};
  }
  const pick = best||first; if(!pick) throw new Error("해당 지점의 수온 값이 없습니다");
  return {v:pick.v, time:new Date(pick.t).toISOString()};
}

    state.data.live = {west:w.v, east:e.v, diff:+(w.v-e.v).toFixed(2), time:e.time, fetchedAt:new Date().toISOString(), source:"Open-Meteo Marine API"};
    save(); toast("실시간 해수면 온도를 불러왔습니다.");

async function callClaude(system, userText){
  let key=""; try{ key = localStorage.getItem(LS.apiKey)||""; }catch(e){}
  if(!key) throw new Error("API 키가 없습니다. 위에 키를 먼저 입력하세요.");
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true",
      "anthropic-beta":"server-side-fallback-2026-07-01"
    },
    body: JSON.stringify({
      model: AI_MODEL, fallbacks: "default", max_tokens: 16000,
      output_config: {effort: "medium"},
      system, messages:[{role:"user", content:userText}]
    })
  });
  const data = await resp.json().catch(()=>({}));
  if(!resp.ok) throw new Error((data && data.error && data.error.message) || ("요청 실패 (HTTP "+resp.status+")"));
  if(data.stop_reason==="refusal") throw new Error("AI가 이 요청에 답하지 않았습니다. 내용을 다듬어 다시 시도하거나 선생님께 문의하세요.");
  const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  if(!text) throw new Error("피드백이 비어 있습니다. 잠시 후 다시 시도하세요.");
  return text;
}

      <div class="idgrid">
        <div class="idcell"><div class="il">이름</div><input id="rName" value="${esc(state.student.name)}" oninput="onId()"></div>
        <div class="idcell"><div class="il">학번</div><input id="rId" value="${esc(state.student.id)}" oninput="onId()"></div>
        <div class="idcell"><div class="il">형성평가</div><div class="big" style="color:var(--amber)">${qScore}/${QUIZ.length}</div></div>
        <div class="idcell"><div class="il">데이터 과제</div><div class="big" style="color:var(--amber)">${eventScore()}/${EVENTS.length}</div></div>
      </div></div>
    <div class="rsec"><div class="rt">예측·진단 (STEP 01)</div>
      ${PREDICT.map((it,i)=>line("P"+(i+1)+". "+it.q, state.predict[i]===undefined?"—":"ABC"[state.predict[i]]+". "+it.opts[state.predict[i]])).join("")}
      ${line("K · 알던 것", txt(state.kw.k))}${line("W · 알고 싶던 것", txt(state.kw.w))}</div>
    <div class="rsec"><div class="rt"><span>시뮬레이터 (STEP 03)</span><span class="score">체크리스트 ${ckN}/5</span></div>
      ${line("마지막 설정", "무역풍 "+Math.round(m.w*100)+"% → "+CLS_NAME[m.cls]+"형 · 편차 "+sgn(m.oni)+" ℃ · 수온약층 서/동 "+Math.round(m.dW)+"/"+Math.round(m.dE)+" m · 강수 중심 "+lonLabel(m.rainLon))}
      ${line("관찰(인과 사슬)", txt(state.sim.note))}</div>
    <div class="rsec"><div class="rt"><span>실제 데이터 (STEP 04)</span><span class="score">${eventScore()}/${EVENTS.length}</span></div>
      ${line("자료", ONI.state==="ok" ? "NOAA CPC ONI · "+esc(ONI.source)+" · 최신 "+esc(seasonLabel(st.last))+" "+sgn(st.last.a)+" ℃" : "ONI 자료 없음")}
      ${EVENTS.map(ev=>{ const r=state.data.events[ev.id]; return line(ev.label+" 최고 ONI", r? (esc(r.v)+" "+(r.ok===true?"✓":r.ok===false?"✗":"")) : "—", r&&r.ok?"ok":r&&r.ok===false?"no":""); }).join("")}
      ${line("가장 강했던 사건", state.data.strongest ? esc((EVENTS.find(e=>e.id===state.data.strongest)||{}).label||"") : "—")}
      ${line("공통점", txt(state.data.common))}
      ${line("실시간 수온", L && !L.error ? "서 "+(+L.west).toFixed(1)+" ℃ / 동 "+(+L.east).toFixed(1)+" ℃ · 차 "+(+L.diff).toFixed(1)+" ℃ ("+esc(L.source)+")" : "—")}
      ${line("내 판단", state.data.judge ? CLS_NAME[state.data.judge]+"에 가깝다" : "—")}
      ${line("근거", txt(state.data.reason))}</div>
    <div class="rsec"><div class="rt"><span>형성평가 (STEP 05)</span><span class="score">${qScore}/${QUIZ.length}</span></div>
      ${QUIZ.map((it,i)=>{ const s=state.quiz[i]; return line("Q"+(i+1)+". "+it.q, s===undefined?"(미응답)":"ABCD"[s]+". "+it.opts[s]+" "+(s===it.a?"✓":"✗"), s===undefined?"neu":s===it.a?"ok":"no"); }).join("")}</div>
    <div class="rsec"><div class="rt">GRASPS 수행과제 (STEP 06)</div>
      ${line("선택한 과제", b ? esc(b.proxLabel)+" — "+esc(b.role)+" → "+esc(b.audience) : "—")}
      ${line("산출물", txt(state.grasps.product))}
      ${state.grasps.ai ? line("AI 피드백 초안 (교사 검토 전)", txt(state.grasps.ai)) : ""}</div>
    <div class="rsec"><div class="rt">성찰 (STEP 07)</div>
      ${line("L · 배운 것", txt(state.reflect.l))}
      ${line("W 해결", {yes:"해결됐다",part:"일부 해결",no:"아직 궁금하다"}[state.reflect.wDone]||"—")}
      ${SELF.map(it=>line(it.t, state.reflect.self[it.k]?state.reflect.self[it.k]+" / 5":"—")).join("")}
      ${line("세계 시민으로서", txt(state.reflect.citizen))}</div>
    <div class="foot">
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn btn-prev" onclick="go(${cur-1})">← 이전</button>
        <button class="btn btn-prev" onclick="window.print()">🖨 인쇄 / PDF</button>
        <button class="btn btn-prev" onclick="downloadReport()">⭳ 다운로드</button>
      </div>
      <button class="btn btn-next" id="submitBtn" onclick="submitReport()">${mode==="download"?"보고서 저장 →":"제출하기 →"}</button>
    </div></div>`;
}
window.onId = ()=>{ state.student.name=$("#rName").value; state.student.id=$("#rId").value;
  try{ localStorage.setItem(LS.student, JSON.stringify(state.student)); }catch(e){} $("#whoName").textContent=state.student.name||"—"; save(); };

function buildPayload(){
  const m=model(state.sim.w), st = ONI.state==="ok" ? currentStatus(ONI.series) : null;
  const b=BUNDLES.find(x=>x.id===state.grasps.bundle);
  return {
    activityId:"enso", activityVersion:1, topic:"enso",
    unit:"통합과학2 Ⅴ-2 기후 변화와 지구 환경", standard:"[10통과2-02-03]",
    timestamp:new Date().toISOString(),
    name:state.student.name, studentId:state.student.id,
    predict:state.predict, kwl:{k:state.kw.k, w:state.kw.w, l:state.reflect.l, wDone:state.reflect.wDone},
    sim:{ tradeWind:+m.w.toFixed(2), state:m.cls, anomaly:+m.oni.toFixed(2), checklist:state.sim.check, note:state.sim.note },
    data:{
      oniSource: ONI.state==="ok" ? ONI.source : null,
      oniLatest: st ? {season:seasonLabel(st.last), value:st.last.a, state:st.k, run:st.n} : null,
      events:state.data.events, eventScore:eventScore(), eventMax:EVENTS.length,
      strongest:state.data.strongest, common:state.data.common,
      live:state.data.live, judge:state.data.judge, reason:state.data.reason
    },
    quiz:state.quiz, quizScore:score(QUIZ,state.quiz), quizMax:QUIZ.length,
    grasps:{ bundle:state.grasps.bundle, proximity: b?b.id:null, product:state.grasps.product, aiFeedbackDraft:state.grasps.ai },
    reflect:{ self:state.reflect.self, citizen:state.reflect.citizen }
  };
}
function submitMode(){
  const s = CONFIG.submit||{}; const m = s.mode;
  if(m==="googleForm" && s.googleForm && s.googleForm.formId) return "googleForm";
  if(m==="endpoint" && s.endpoint) return "endpoint";
  return "download";
}
window.downloadReport = ()=>{
  const blob=new Blob([JSON.stringify(buildPayload(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`엘니뇨_보고서_${state.student.name||"학생"}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
function submitViaGoogleForm(payload){
  return new Promise(resolve=>{
    const gf = CONFIG.submit.googleForm;
    let sink = document.getElementById("gform_sink");
    if(!sink){ sink=document.createElement("iframe"); sink.id="gform_sink"; sink.name="gform_sink"; sink.style.display="none"; document.body.appendChild(sink); }
    const form=document.createElement("form"); form.style.display="none";
    form.action="https://docs.google.com/forms/d/e/"+gf.formId+"/formResponse"; form.method="POST"; form.target="gform_sink";
    const vals={ name:payload.name, studentId:payload.studentId, quizScore:payload.quizScore+"/"+payload.quizMax,
      bundle:payload.grasps.bundle||"", product:payload.grasps.product||"",
      reflection:(payload.kwl.l||"")+(payload.reflect.citizen?"\n[세계 시민] "+payload.reflect.citizen:""),
      payload:JSON.stringify(payload) };
    const map=gf.entries||{};
    Object.keys(map).forEach(k=>{ if(map[k]){ const inp=document.createElement("input"); inp.type="hidden"; inp.name=map[k]; inp.value=(vals[k]!=null?vals[k]:""); form.appendChild(inp); } });
    let done=false; const finish=()=>{ if(done)return; done=true; resolve(); };
    sink.addEventListener("load", finish, {once:true});
    document.body.appendChild(form); form.submit();
    setTimeout(finish, 2500); setTimeout(()=>{ try{form.remove();}catch(e){} }, 3200);
  });
}
window.submitReport = async ()=>{
  if(!state.student.name){ toast("이름을 입력해 주세요.",true); return; }
  const btn=$("#submitBtn"); const orig=btn.textContent; btn.disabled=true; btn.textContent="제출 중...";
  const payload=buildPayload(); const mode=submitMode();
  try{
    if(mode==="googleForm"){ await submitViaGoogleForm(payload); toast("제출되었습니다. 수고했어요!"); }
    else if(mode==="endpoint"){
      const r=await fetch(CONFIG.submit.endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(!r.ok) throw new Error("HTTP "+r.status); toast("제출되었습니다. 수고했어요!");
    } else { window.downloadReport(); toast("보고서를 파일로 저장했습니다. 이 파일을 제출하세요."); }
    state.done.submit=true; save(); renderNav();
  }catch(err){ toast("제출 실패: "+(err.message||err),true); }
  finally{ btn.disabled=false; btn.textContent=orig; }
};

/* ---------- toast ---------- */
let toTimer=null;
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(err?" err":""); clearTimeout(toTimer); toTimer=setTimeout(()=>t.className="toast",3200); }

/* ============================================================
   부팅
   ============================================================ */
async function boot(){
  load();
  $("#whoName").textContent = state.student.name||"—";
  if(state.student.name) $("#intro").classList.add("hidden");
  $("#introGo").onclick=()=>{
    const n=$("#inName").value.trim(), id=$("#inId").value.trim();
    if(!n){ $("#inName").focus(); return; }
    state.student={name:n,id:id}; try{ localStorage.setItem(LS.student,JSON.stringify(state.student)); }catch(e){} save();
    $("#whoName").textContent=n; $("#intro").classList.add("hidden");
  };
  $("#inName").addEventListener("keydown",e=>{ if(e.key==="Enter")$("#inId").focus(); });
  $("#inId").addEventListener("keydown",e=>{ if(e.key==="Enter")$("#introGo").click(); });
  $("#btnReset").onclick=()=>{
    if(confirm("이 활동의 답안과 진행 상황을 초기화할까요? (이름·API 키는 유지됩니다)")){
      try{ localStorage.removeItem(LS.state); }catch(e){} location.hash=""; location.reload();
    }
  };
  const h=(location.hash||"").replace("#","");
  const hi=STEPS.findIndex(s=>s.id===h); if(hi>=0) cur=hi;
  renderAll();
  await loadONI();
  if(STEPS[cur].id==="data") rData();
}
boot();
</script>
