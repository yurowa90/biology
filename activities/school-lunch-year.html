<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 0) => v == null || isNaN(v) ? "–" : Number(v).toLocaleString("ko-KR", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const say = t => { const l = $("#live"); l.textContent = ""; setTimeout(() => l.textContent = t, 30); };
const BANK = window.LUNCH_BANK || { menus: [], allergens: [], meta: {} };
const M = BANK.menus, AL = BANK.allergens, HAS_NUT = M.some(m => m.nut);
const byName = Object.fromEntries(M.map((m, i) => [m.n, i]));

/* 학교급식법 시행규칙 [별표 3] 고등학생 한 끼 기준. 비타민·무기질은 [평균필요량, 권장섭취량] */
const STD = {
  M: { kcal: 900, pro: 21.7, va: [207, 284], b1: [0.37, 0.44], b2: [0.47, 0.57], vc: [26.7, 33.4], ca: [250, 300], fe: [3.7, 4.7] },
  F: { kcal: 670, pro: 18.4, va: [150, 217], b1: [0.30, 0.37], b2: [0.34, 0.40], vc: [26.7, 33.4], ca: [234, 267], fe: [3.7, 4.7] } };
const NUTS = [["va", "비타민A", "㎍RAE"], ["b1", "티아민", "mg"], ["b2", "리보플라빈", "mg"], ["vc", "비타민C", "mg"], ["ca", "칼슘", "mg"], ["fe", "철", "mg"]];
const NA_REF = Math.round(2300 / 3); // 참고: 2025 KDRI 나트륨 만성질환위험감소섭취량 하루 2,300mg의 3분의 1(별표 3에는 나트륨 기준 없음)
const SLOTS = [["밥", "밥"], ["국", "국·찌개"], ["주찬", "주찬"], ["부찬", "부찬"], ["김치", "김치"], ["후식", "후식(선택)"], ["우유", "우유(선택)"]];
const MAX = { 밥: 1, 국: 1, 주찬: 1, 부찬: 2, 김치: 1, 후식: 1, 우유: 1 };
const MEAT_RE = /고기|소고기|쇠고기|한우|닭|오리|돼지|돈육|갈비|제육|햄|소시지|베이컨|어묵|참치|멸치|황태|북어|오징어|새우|홍합|바지락|조개|연어|고등어|삼치|코다리|사골|육개장|곰탕|삼계|수육|불고기|함박|치킨|진미채|해물|탕수|꿔바로우|부대/;
const ANIMAL = [7, 8, 9, 10, 15, 16, 17, 18];
const vegOk = d => !MEAT_RE.test(d.n) && !d.a.some(c => ANIMAL.includes(c));
const inSeason = (d, mon) => d.mo.includes(mon) || (d.sm || []).includes(mon);

/* 1년 6일 — 학생은 가상 인물. hard: 지켜야 제출할 수 있음(알레르기·종교·신념), soft: 만족도 */
const DAYS = [
  { mon: 3, when: "3월 첫째 주", title: "새 학기 첫 급식", ico: "🌱", budget: 9,
    brief: "신입생 알레르기 조사서가 들어왔어요. 학교는 알레르기 유발 식재료를 표시한 월간 식단표를 가정통신문과 학교 홈페이지로 알리고, 주간 식단표를 식당과 교실에 게시해야 해요(학교급식법 시행규칙 제7조제2항).",
    learn: "표시 대상 알레르기 유발물질은 19종이에요. 김치와 국에는 새우젓(9번)이, 간장 요리에는 대두(5번)와 밀(6번)이 숨어 있는 경우가 많아요.",
    theme: { label: "봄나물(냉이·달래·봄동·시금치 등)", test: d => /냉이|달래|봄동|쑥|두릅|미나리|참나물|시금치/.test(d.n) },
    guests: [
      { name: "서윤", ava: "🧑‍🎓", who: "1학년", say: "우유 알레르기가 있어요. 우유가 들어간 음식은 먹으면 안 돼요.", hard: { type: "allergy", codes: [2] } },
      { name: "도현", ava: "🧒", who: "1학년", say: "새우를 먹으면 두드러기가 나요. 김치는 좋아하는데…", hard: { type: "allergy", codes: [9] } },
      { name: "지호", ava: "🙂", who: "1학년", say: "아직 매운 걸 잘 못 먹어요. 첫날부터 매운 건 무서워요.", soft: { type: "spicyMax", n: 0, label: "매운 메뉴 없이" } }] },
  { mon: 6, when: "6월 셋째 주", title: "장마철 식중독 주의", ico: "☔", budget: 9, hygiene: true,
    brief: "덥고 습한 장마철이에요. 학교급식 위생·안전관리기준(시행규칙 별표 4)에 따라 날로 먹는 채소·과일은 충분히 세척·소독하고, 가열 조리는 중심부 75℃(조개류 85℃) 이상에서 1분 이상, 조리가 끝난 음식은 2시간 안에 배식을 마쳐야 해요.",
    learn: "날로 먹는 메뉴와 조개류 메뉴가 많을수록 조리실이 지켜야 할 위생 작업이 늘어요. 금지된 건 아니지만, 위험과 일손을 함께 따져야 해요.",
    theme: { label: "익혀서 만든 채소 반찬(볶음·조림·전·구이)", test: d => d.s === "부찬" && ["볶음", "조림", "전", "구이"].includes(d.m) },
    guests: [
      { name: "준우", ava: "🏃", who: "2학년 육상부", say: "오후에 훈련이 있어서 든든하게 먹고 싶어요.", soft: { type: "energy", label: "에너지 기준 이상, 단백질 기준의 1.3배 이상" } },
      { name: "하린", ava: "🧑", who: "2학년", say: "땅콩 알레르기가 있어요. 견과류 반찬이 나오면 꼭 확인해 주세요.", hard: { type: "allergy", codes: [4] } },
      { name: "은채", ava: "😐", who: "3학년", say: "나물은 솔직히 잘 안 먹게 돼요. 채소도 맛있게 먹고 싶긴 한데…", soft: { type: "cookedVeg", label: "볶음·조림·전·구이로 만든 채소 반찬" } }] },
  { mon: 7, when: "7월 중순", title: "초복 무렵", ico: "🔥", budget: 11,
    brief: "초복은 삼복 더위가 시작되는 날이에요. 예부터 더위를 이기려고 삼계탕 같은 보양식을 먹었어요. 학교급식은 전통 식문화의 계승·발전을 고려해야 하지만(시행규칙 제5조제2항 1호), 예산과 모든 학생을 함께 생각해야 해요.",
    learn: "특별한 날은 예산을 조금 더 쓰는 대신 다른 날에 아끼는 식으로 한 달 단위로 맞추는 경우가 많아요.",
    theme: { label: "초복 보양식", test: d => d.t.includes("보양") },
    guests: [
      { name: "태민", ava: "🥵", who: "1학년", say: "복날엔 삼계탕이죠! 몸보신하고 싶어요.", soft: { type: "tag", tag: "보양", label: "보양 메뉴 1개 이상" } },

    else if (cur.length >= MAX[d.s]) { if (MAX[d.s] === 1) { say(`${M[cur[0]].n} 대신 ${d.n}을(를) 담았어요.`); cur[0] = i; } else return say(`${d.s}은(는) ${MAX[d.s]}개까지 담을 수 있어요. 하나를 빼 주세요.`); }
    else { cur.push(i); say(`${d.n}을(를) ${d.s} 칸에 담았어요.`); }
    pruneTasks(st); save(); return rerenderKeep(`[data-act="pick"][data-i="${i}"]`); }
  if (a === "rem") { const k = b.dataset.k, i = +b.dataset.i, cur = st.plate[k] || []; if (cur.includes(i)) cur.splice(cur.indexOf(i), 1); pruneTasks(st); save(); say(`${M[i].n}을(를) 뺐어요.`); return rerenderKeep(); }
  if (a === "submit") { const ev = evaluate(S.day); if (!ev.filled || ev.sf.blocked) return; st.done = true; st.at = new Date().toISOString(); save(); say("배식했어요. 결과를 확인하세요."); return render(true); }
});
function pruneTasks(st) { // 식판에서 빠진 메뉴의 '레시피 확인'은 지운다
  const names = new Set(dishes(st).map(d => d.n)); for (const k of Object.keys(st.chk)) if (!names.has(k.split("|")[1])) delete st.chk[k]; }
document.addEventListener("change", e => {
  const el = e.target, k = el.dataset && el.dataset.in; if (!k || S.view !== "day") return; const st = D(); if (st.done) return;
  if (k === "alt") st.alt[el.dataset.g] = el.checked;
  if (k === "chk") st.chk[el.dataset.k] = el.checked;
  save(); rerenderKeep("#" + CSS.escape(el.id));
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "inName") { S.name = el.value.trim(); return save(); }
  if (el.id === "inTeam") { S.team = el.value.trim(); return save(); }
  if (el.id === "inMale") { S.male = +el.value; save(); $("#maleOut").textContent = S.male + "%"; $("#stdOut").textContent = fmt(std().kcal) + " kcal"; return; }
  if (el.id === "inQ") { D().q = el.value; save(); return rerenderKeep("#inQ"); }
  if (el.dataset.in === "why") { S.days[S.day].why = el.value; save(); const n = el.value.trim().length, c = $("#whyCnt"); if (c) c.textContent = `${n}/10자 이상`;
    const bt = document.querySelector('[data-act="next"],[data-act="summary"]'); if (bt) bt.disabled = n < 10; return; }
  if (el.dataset.in === "refl") { S.refl[el.dataset.k] = el.value; save(); const r = $("#rep"); if (r) r.textContent = reportText(); }
});
if (S.view === "day" && !DAYS[S.day]) S.view = "home";
render();
</script>
