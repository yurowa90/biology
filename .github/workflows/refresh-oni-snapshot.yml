name: Refresh ONI snapshot

# 저장소에 커밋되는 오프라인용 스냅샷(data/oni.json, activities/enso.html 내장 스냅샷)을
# NOAA 최신값으로 갱신해 커밋합니다. Actions 탭에서 필요할 때 한 번 눌러 실행하세요.
# (배포용 데이터는 deploy-pages.yml 이 배포 때마다 따로 받습니다.)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch NOAA ONI (strict)
        run: node scripts/fetch-oni.mjs --strict --inject activities/enso.html

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/oni.json activities/enso.html; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oni.json activities/enso.html
          git commit -m "data: NOAA ONI 스냅샷 갱신 [skip ci]"
          git push
