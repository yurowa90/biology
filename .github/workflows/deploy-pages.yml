name: Deploy to GitHub Pages

# 저장소 → Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 한 번 설정하면
# 아래 브랜치에 푸시할 때마다 정적 사이트(index.html)가 자동 배포됩니다.
#
# 기후 데이터(NOAA ONI)는 커밋 없이 "배포할 때마다" 받아 아티팩트에 싣습니다.
#  - 매주 한 번(schedule) 다시 배포해 최신 ONI 를 반영합니다.
#    ※ GitHub 의 schedule 은 저장소 "기본 브랜치"에 있는 이 파일 기준으로만 실행됩니다.
#  - 받기에 실패해도 배포는 계속되며, 저장소에 커밋된 data/oni.json 이 그대로 쓰입니다.

on:
  push:
    branches:
      - main
      - master
      - claude/bioscience-webapp-se292i
  schedule:
    - cron: "47 21 * * 0"   # 매주 월요일 06:47 (KST) = 일요일 21:47 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh climate data (NOAA ONI)
        # 실패해도 배포를 막지 않습니다(커밋된 스냅샷으로 폴백).
        continue-on-error: true
        run: node scripts/fetch-oni.mjs --inject activities/enso.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages가 아직 켜져 있지 않아도 워크플로가 자동으로 활성화(build_type: workflow)
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # 저장소 루트를 그대로 배포합니다(index.html = 교과서 홈).
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
