name: Deploy to GitHub Pages

# 저장소 → Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 한 번 설정하면
# 아래 브랜치에 푸시할 때마다 정적 사이트(index.html)가 자동 배포됩니다.

on:
  push:
    branches:
      - main
      - master
      - claude/bioscience-webapp-se292i
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages가 아직 켜져 있지 않아도 워크플로가 자동으로 활성화(build_type: workflow)
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # 저장소 루트의 index.html 을 그대로 배포합니다.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
